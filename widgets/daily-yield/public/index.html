<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Yield</title>
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  /* Sizes, colours and spacing from Homey's widget styling guide (--homey-*). The hero
     figure uses the largest size the guide has for numbers, 32 px (it was 36 px), and no
     text is smaller than --homey-font-size-small (1.2.300). */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  #content { display: flex; flex-direction: column; gap: var(--homey-su-3); }

  .main-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--homey-su-4);
  }

  .label {
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
  }

  .daily-value {
    font-size: var(--homey-font-size-xxlarge);
    line-height: var(--homey-line-height-xxlarge);
    font-weight: var(--homey-font-weight-bold);
    color: #F59E0B;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .daily-unit {
    font-size: var(--homey-font-size-small);
    font-weight: var(--homey-font-weight-medium);
    color: var(--homey-text-color-light);
  }

  .total-block { text-align: right; }

  .total-value {
    font-size: var(--homey-font-size-default);
    line-height: var(--homey-line-height-default);
    font-weight: var(--homey-font-weight-medium);
    color: var(--homey-text-color);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* CO₂ + Optimizer row */
  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--homey-su-2);
    padding-top: var(--homey-su-3);
    border-top: var(--homey-line);
  }
  .meta-row:empty, .meta-row.empty { display: none; }

  .co2-chip,
  .opt-chip {
    display: flex;
    align-items: center;
    gap: var(--homey-su-1);
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
  }

  .co2-icon {
    width: var(--homey-icon-size-small, 14px);
    height: var(--homey-icon-size-small, 14px);
    flex-shrink: 0;
  }

  .co2-text {
    font-weight: var(--homey-font-weight-bold);
    color: var(--homey-color-green);
    font-variant-numeric: tabular-nums;
  }

  .opt-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--homey-color-green);
    flex-shrink: 0;
  }

  /* Skeleton */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.7; }
  }
  body.loading #daily-val,
  body.loading .total-value {
    animation: skeleton-pulse 1.4s ease-in-out infinite;
  }
  /* Values the app has not confirmed for two polls are dimmed, not shown as live. */
  body.stale .daily-value, body.stale .total-value, body.stale .co2-text { opacity: 0.45; }
</style>
</head>
<body class="homey-widget loading">

<div id="content">
<div class="main-row">
  <div class="daily-block">
    <div class="label" id="label-daily"></div>
    <div class="daily-value">
      <span id="daily-val">—</span><span class="daily-unit" id="daily-unit"></span>
    </div>
  </div>
  <div class="total-block">
    <div class="label" id="label-total"></div>
    <div class="total-value" id="total-val">—</div>
  </div>
</div>

<div class="meta-row" id="meta-row">
  <!-- CO₂ chip -->
  <div class="co2-chip" id="co2-chip" style="display:none">
    <svg class="co2-icon" viewBox="0 0 24 24" fill="none" style="stroke:var(--homey-color-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
      <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
    </svg>
    <span class="co2-text" id="co2-val"></span>
    <span id="label-co2"></span>
  </div>

  <!-- Optimizer chip -->
  <div class="opt-chip" id="opt-chip" style="display:none">
    <div class="opt-dot" id="opt-dot"></div>
    <span id="opt-text"></span>
  </div>

  <div class="label" id="status" style="display:none"></div>
</div>
</div>

<script>
// Language comes from the API payload (Homey i18n.getLanguage()), not
// navigator.language — see lib/widget-data.js.
var DICTS = (function() {
  var de = { daily: 'Heute erzeugt',   total: 'Gesamt', co2: 'CO₂ gespart',  optimizers: 'Optimierer',
             unreachable: 'App antwortet nicht', stale: '⚠ nicht aktuell' };
  var nl = { daily: 'Vandaag opgewekt', total: 'Totaal', co2: 'CO₂ bespaard', optimizers: 'Optimizers',
             unreachable: 'App reageert niet', stale: '⚠ niet actueel' };
  var en = { daily: 'Generated today',  total: 'Total',  co2: 'CO₂ saved',    optimizers: 'Optimizers',
             unreachable: 'App not responding', stale: '⚠ not current' };
  return { de: de, nl: nl, en: en };
})();
function dictFor(code) {
  var l = String(code || '');
  return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
}
var activeLang = null;
var T = dictFor(navigator.language); // placeholder until the first payload arrives
function applyLang(code) {
  if (!code || code === activeLang) return false;
  activeLang = code;
  T = dictFor(code);
  applyStaticLabels();
  return true;
}

// Re-applied on a language change so static labels never stay in the
// language the widget first rendered in (mixed-language UI).
function applyStaticLabels() {
  document.getElementById('label-daily').textContent = T.daily;
  document.getElementById('label-total').textContent = T.total;
  document.getElementById('label-co2').textContent   = T.co2;
}
applyStaticLabels();

/* ── Shared by this app's widgets (the same block in each — a widget cannot load another
   widget's files). fmtNum writes numbers the way the dashboard language does: 8,8 kW in
   German, 8.8 kW in English (1.2.300). poller asks one request at a time, says so when the
   first answer never comes, dims values after two missed answers instead of showing them
   as live, and rests while the dashboard is hidden. fitHeight follows content whose height
   changes, through Homey.setHeight, and only when it does. ───────────────────────────── */
var _nf = {};
function fmtNum(v, digits) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  var key = (activeLang || '') + '|' + digits;
  if (!_nf[key]) {
    try { _nf[key] = new Intl.NumberFormat(activeLang || undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
    catch (e) { _nf[key] = { format: function (x) { return x.toFixed(digits); } }; }
  }
  return _nf[key].format(v);
}
function poller(opts) {
  var busy = false, timer = null, loaded = false, misses = 0;
  function tick() {
    if (busy) return;
    busy = true;
    Promise.resolve().then(opts.run).then(function (data) {
      busy = false; misses = 0; loaded = true;
      document.body.classList.remove('stale');
      opts.onOk(data);
    }, function (err) {
      busy = false; misses++;
      if (!loaded) opts.onFail(true, err);
      else if (misses >= 2) { document.body.classList.add('stale'); opts.onFail(false, err); }
    });
  }
  function start() { if (!timer) timer = setInterval(tick, opts.ms); }
  function stop()  { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stop(); return; }
    tick(); start();
  });
  tick();
  if (!document.hidden) start();
  return { now: tick };
}
var _fitH = 0;
function fitHeight(Homey, el) {
  requestAnimationFrame(function () {
    var h = Math.ceil(el.getBoundingClientRect().bottom);
    if (h > 0 && h !== _fitH) { _fitH = h; Homey.setHeight(h); }
  });
}
/* ── end of the shared block ── */

// One decimal, as the energy balance writes the same figure (1.2.300; this one used two).
function fmtKwh(v) {
  if (v === null || v === undefined) return { num: '—', unit: '' };
  if (v >= 1000) return { num: fmtNum(v / 1000, 1), unit: ' MWh' };
  return { num: fmtNum(v, 1), unit: ' kWh' };
}

function onHomeyReady(Homey) {
  var co2Factor = 401; // default: DE Strommix g/kWh
  try {
    var s = Homey.getSettings();
    if (s && s.co2_factor_g_per_kwh) co2Factor = parseFloat(s.co2_factor_g_per_kwh) || 401;
  } catch(e) {}

  var content  = document.getElementById('content');
  var statusEl = document.getElementById('status');
  var metaRow  = document.getElementById('meta-row');

  // Ready once, with the height of the first drawing; the CO₂ and optimizer line comes
  // and goes with the data, and the height follows it.
  var readied = false;
  function settle() {
    var shown = [].some.call(metaRow.children, function (c) { return c.style.display !== 'none'; });
    metaRow.classList.toggle('empty', !shown);
    if (!readied) {
      readied = true;
      requestAnimationFrame(function () {
        Homey.ready({ height: Math.ceil(content.getBoundingClientRect().bottom) + 16 });
      });
    } else {
      fitHeight(Homey, document.body);
    }
  }

  function render(data) {
    document.body.classList.remove('loading');
    statusEl.style.display = 'none';

    var daily = fmtKwh(data.dailyKwh);
    document.getElementById('daily-val').textContent  = daily.num;
    document.getElementById('daily-unit').textContent = daily.unit;

    var total = fmtKwh(data.totalKwh);
    document.getElementById('total-val').textContent =
      (total.num !== '—') ? total.num + total.unit : '—';

    // CO₂ — calculated here, from the factor in the widget's settings
    var co2Chip = document.getElementById('co2-chip');
    if (data.dailyKwh !== null && data.dailyKwh !== undefined) {
      var co2Kg = data.dailyKwh * co2Factor / 1000;
      co2Chip.style.display = 'flex';
      document.getElementById('co2-val').textContent = fmtNum(co2Kg, 1) + ' kg';
    } else {
      co2Chip.style.display = 'none';
    }

    // Optimizers
    var tot = data.optimizerTotal;
    var onl = data.optimizerOnline;
    var optChip = document.getElementById('opt-chip');
    if (tot !== null && tot !== undefined && onl !== null && onl !== undefined) {
      optChip.style.display = 'flex';
      document.getElementById('opt-text').textContent = onl + '/' + tot + ' ' + T.optimizers;
      document.getElementById('opt-dot').style.background =
        (onl >= tot) ? 'var(--homey-color-green)' : (onl > 0 ? '#F59E0B' : 'var(--homey-color-red)');
    } else {
      optChip.style.display = 'none';
    }
    settle();
  }

  // Once a minute: these are day totals (1.2.300; it asked every 10 s).
  poller({
    ms: 60000,
    run: function () { return Homey.api('GET', '/', {}); },
    onOk: function (data) { applyLang(data && data.lang); if (data) render(data); },
    onFail: function (first) {
      document.body.classList.remove('loading');
      statusEl.textContent = first ? T.unreachable : T.stale;
      statusEl.style.display = '';
      settle();
    },
  });
}
</script>
</body>
</html>
