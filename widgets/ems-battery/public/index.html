<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  /* Colors come from Homey's own --homey-* variables (see the widget styling
     guide), which the dashboard sets according to the user's light/dark theme
     choice — NOT the OS-level prefers-color-scheme, which widgets don't get to
     read reliably. Never hardcode light/dark pairs here again. */
  /* Sizes and spacing from Homey's widget styling guide too (1.2.300): no text below
     --homey-font-size-small, no second card inside Homey's own frame. */
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--homey-text-color); }
  .card { display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: var(--homey-su-2); }
  .title, .soc {
    font-size: var(--homey-font-size-default); line-height: var(--homey-line-height-default);
    font-weight: var(--homey-font-weight-bold);
  }
  .soc { font-variant-numeric: tabular-nums; }
  .soc.green  { color: var(--homey-color-green); }
  .soc.red    { color: var(--homey-color-red); }
  .kwh-line, .status-line, .zone-field .pct, .zone-field label, .no-data {
    font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
  }
  .kwh-line { min-height: var(--homey-line-height-small); }

  .bar-wrap { position: relative; margin-top: var(--homey-su-3); height: 16px; }
  .bar-track {
    position: absolute; inset: 0; border-radius: 8px; overflow: hidden;
    background: var(--homey-line-color-light); display: flex;
  }
  .bar-fill { height: 100%; transition: width 0.3s ease; }
  .bar-fill.green  { background: var(--homey-color-green); }
  .bar-fill.red    { background: var(--homey-color-red); }
  .bar-marker {
    position: absolute; top: -3px; width: 2px; height: 22px; background: var(--homey-text-color-light);
  }

  .zones-row { display: flex; justify-content: space-between; margin-top: var(--homey-su-3); }
  .zone-field { display: flex; align-items: center; gap: var(--homey-su-2); }
  .zone-field input {
    -webkit-user-select: text; user-select: text;
    width: 64px; font: inherit; font-size: var(--homey-font-size-default); font-weight: var(--homey-font-weight-medium);
    text-align: right; padding: var(--homey-su-1) var(--homey-su-2); border-radius: var(--homey-border-radius-small);
    border: var(--homey-line); background: transparent; color: var(--homey-text-color);
  }
  .zone-field input:focus-visible { outline: 2px solid var(--homey-color-blue); outline-offset: 1px; }

  .status-line {
    display: flex; align-items: center; gap: var(--homey-su-2);
    margin-top: var(--homey-su-3); padding-top: var(--homey-su-3); border-top: var(--homey-line);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.charge { background: var(--homey-color-green); }
  .status-dot.hold   { background: var(--homey-color-orange, #f5a524); }
  .status-dot.idle   { background: var(--homey-line-color); }

  .no-data { text-align: center; padding: var(--homey-su-4) var(--homey-su-1); }
  body.stale .soc, body.stale .kwh-line { opacity: 0.45; }
</style>
</head>
<body class="homey-widget">
  <div class="card" id="card">
    <div class="no-data" id="noData" style="display:none"></div>
    <div id="content" style="display:none">
      <div class="head">
        <div class="title" id="title">—</div>
        <div class="soc" id="socVal">—</div>
      </div>
      <div class="kwh-line" id="kwhLine"></div>

      <div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
        <div class="bar-marker" id="markerNormal"></div>
      </div>

      <div class="zones-row">
        <div class="zone-field">
          <label id="stopLabel">—</label>
          <input type="number" id="stopInput" min="0" max="100" step="1">
          <span class="pct">%</span>
        </div>
      </div>

      <div class="status-line">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">—</span>
      </div>
    </div>
  </div>

<script type="text/javascript">
function onHomeyReady(Homey) {
  // Language comes from the API payload (Homey's own i18n.getLanguage()), not from
  // navigator.language — that is the browser/OS language and can differ from the Homey
  // app language. See widgets/ems-device/api.js for the full rationale.
  var DICTS = (function () {
    var de = {
      title: 'Batterienutzung', noBattery: 'Keine Batterie konfiguriert', unreachable: 'EMS-Gerät nicht erreichbar',
      stop: 'Stopp unter', kwhOf: 'von',
      zoneGreen: 'Solar frei', zoneRed: 'Geschützt — lädt Batterie',
      priceCharge: 'Preisgeladen', priceHold: 'Entladen gesperrt (Preis)', priceIdle: 'Preisladen aktiviert', writeFailed: 'Änderung fehlgeschlagen',
      aboveRamp: 'Höchstens {max} % — darüber beginnt die Rampe nicht mehr', invalidValue: 'Bitte 0 bis 100 % eingeben', stale: '⚠ nicht aktuell',
    };
    var nl = {
      title: 'Batterijgebruik', noBattery: 'Geen batterij geconfigureerd', unreachable: 'EMS-apparaat niet bereikbaar',
      stop: 'Stop onder', kwhOf: 'van',
      zoneGreen: 'Zon vrij', zoneRed: 'Beschermd — batterij laadt',
      priceCharge: 'Prijsladen actief', priceHold: 'Ontladen geblokkeerd (prijs)', priceIdle: 'Prijsladen ingeschakeld', writeFailed: 'Wijziging mislukt',
      aboveRamp: 'Hoogstens {max} % — daarboven begint de helling niet meer', invalidValue: 'Voer 0 tot 100 % in', stale: '⚠ niet actueel',
    };
    var en = {
      title: 'Battery Usage', noBattery: 'No battery configured', unreachable: 'EMS device unreachable',
      stop: 'Stop below', kwhOf: 'of',
      zoneGreen: 'Solar free', zoneRed: 'Protected — battery charging',
      priceCharge: 'Price-charging', priceHold: 'Discharge held (price)', priceIdle: 'Price-charging enabled', writeFailed: 'Change failed',
      aboveRamp: 'At most {max} % — above that the ramp would no longer start', invalidValue: 'Enter 0 to 100 %', stale: '⚠ not current',
    };
    return { de: de, nl: nl, en: en };
  })();
  function dictFor(code) {
    var l = String(code || '');
    return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
  }
  var activeLang = null;
  var T = dictFor(navigator.language); // placeholder until the first payload arrives
  function applyLang(code) {
    if (!code || code === activeLang) return false;
    activeLang = code;
    T = dictFor(code);
    // These three are set once at startup, so refresh them on a language change.
    titleEl.textContent      = T.title;
    stopLabel.textContent  = T.stop;
    return true;
  }

  /* ── Shared by this app's widgets (the same block in each — a widget cannot load another
     widget's files). fmtNum writes numbers the way the dashboard language does: 8,8 kW in
     German, 8.8 kW in English (1.2.300). poller asks one request at a time, says so when the
     first answer never comes, dims values after two missed answers instead of showing them
     as live, and rests while the dashboard is hidden. fitHeight follows content whose height
     changes, through Homey.setHeight, and only when it does. ───────────────────────────── */
  var _nf = {};
  function fmtNum(v, digits) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    var key = (activeLang || '') + '|' + digits;
    if (!_nf[key]) {
      try { _nf[key] = new Intl.NumberFormat(activeLang || undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
      catch (e) { _nf[key] = { format: function (x) { return x.toFixed(digits); } }; }
    }
    return _nf[key].format(v);
  }
  function poller(opts) {
    var busy = false, timer = null, loaded = false, misses = 0;
    function tick() {
      if (busy) return;
      busy = true;
      Promise.resolve().then(opts.run).then(function (data) {
        busy = false; misses = 0; loaded = true;
        document.body.classList.remove('stale');
        opts.onOk(data);
      }, function (err) {
        busy = false; misses++;
        if (!loaded) opts.onFail(true, err);
        else if (misses >= 2) { document.body.classList.add('stale'); opts.onFail(false, err); }
      });
    }
    function start() { if (!timer) timer = setInterval(tick, opts.ms); }
    function stop()  { if (timer) { clearInterval(timer); timer = null; } }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { stop(); return; }
      tick(); start();
    });
    tick();
    if (!document.hidden) start();
    return { now: tick };
  }
  var _fitH = 0;
  function fitHeight(Homey, el) {
    requestAnimationFrame(function () {
      var h = Math.ceil(el.getBoundingClientRect().bottom);
      if (h > 0 && h !== _fitH) { _fitH = h; Homey.setHeight(h); }
    });
  }
  /* ── end of the shared block ── */

  var card    = document.getElementById('card');
  var noData  = document.getElementById('noData');
  var content = document.getElementById('content');
  var titleEl = document.getElementById('title');
  var socVal  = document.getElementById('socVal');
  var kwhLine = document.getElementById('kwhLine');
  var barFill = document.getElementById('barFill');
  var markerNormal  = document.getElementById('markerNormal');
  var stopLabel   = document.getElementById('stopLabel');
  var stopInput   = document.getElementById('stopInput');
  var statusDot  = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');

  titleEl.textContent      = T.title;
  stopLabel.textContent  = T.stop;

  function showNoData(msg) {
    content.style.display = 'none';
    noData.style.display  = 'block';
    noData.textContent    = msg;
  }

  // A failed write used to be swallowed, so the field just reverted on a later poll with
  // no explanation. Confirm with an immediate refresh instead of waiting a whole poll,
  // and on failure restore the previous value and say why.
  var errorUntil = 0;
  var lastStatus = null;
  function flashError(msg) {
    errorUntil = Date.now() + 4000;
    statusText.textContent = '⚠ ' + msg;
    statusText.style.color = 'var(--homey-text-color-red, #ef4444)';
  }
  // The app's answer codes, in words. With the surplus ramp on, the stop is the ramp's
  // lower point and has to stay below its upper one — a value at or above it is refused
  // with the limit, where it used to switch the ramp off and stop every device (1.2.299).
  function errorText(res) {
    if (res && res.error === 'above_ramp') return T.aboveRamp.replace('{max}', res.max);
    if (res && res.error === 'invalid_value') return T.invalidValue;
    return T.writeFailed;
  }
  function writeZones(body, rollback) {
    Homey.api('POST', '/zones', body)
      .then(function (res) {
        if (res && res.error) { rollback(); flashError(errorText(res)); return; }
        refresh();
      })
      .catch(function () {
        rollback();
        flashError(T.writeFailed);
      });
  }

  var bound = false;
  function bindInputs() {
    if (bound) return;
    bound = true;
    // Enter commits and then blurs the field, and the blur fires 'change' for the same
    // value — the write went out twice. One value, one write.
    var lastCommitted = null;
    var commitStop = function () {
      var v = parseInt(stopInput.value, 10);
      if (!isFinite(v)) return;
      var prev = lastStatus ? lastStatus.stopSoc : null;
      if (v === prev || v === lastCommitted) return;
      lastCommitted = v;
      writeZones({ stopSoc: v }, function () { lastCommitted = null; if (prev != null) stopInput.value = prev; });
    };
    stopInput.addEventListener('focus', function () { lastCommitted = null; });
    stopInput.addEventListener('change', commitStop);
    stopInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { commitStop(); stopInput.blur(); } });
  }

  function render(s) {
    applyLang(s && s.lang); // authoritative language, before anything is drawn
    if (!s || s.error) { showNoData(T.unreachable); syncHeight(); return; }
    if (!s.hasBattery)  { showNoData(T.noBattery); syncHeight(); return; }
    lastStatus = s;

    content.style.display = 'block';
    noData.style.display  = 'none';

    var soc = s.soc != null ? Math.round(s.soc) : null;
    socVal.textContent = soc != null ? fmtNum(soc, 0) + ' %' : '—';
    socVal.className   = 'soc ' + s.zone;
    barFill.className  = 'bar-fill ' + s.zone;
    barFill.style.width = (soc != null ? soc : 0) + '%';

    kwhLine.textContent = (s.energyKwh != null && s.capacityKwh != null)
      ? fmtNum(s.energyKwh, 1) + ' ' + T.kwhOf + ' ' + fmtNum(s.capacityKwh, 1) + ' kWh'
      : '';

    markerNormal.style.left = s.stopSoc + '%';

    if (document.activeElement !== stopInput)  stopInput.value  = s.stopSoc;
    bindInputs();

    var dotClass = 'idle', text = s.zone === 'red' ? T.zoneRed : T.zoneGreen;
    if (s.priceEnabled) {
      if (s.priceMode === 'charge') { dotClass = 'charge'; text = T.priceCharge; }
      else if (s.priceMode === 'hold') { dotClass = 'hold'; text = T.priceHold; }
      else { text += ' · ' + T.priceIdle; }
    }
    statusDot.className = 'status-dot ' + dotClass;
    if (Date.now() >= errorUntil) { // don't overwrite a visible error message
      statusText.textContent = text;
      statusText.style.color = '';
    }

    syncHeight();
  }

  // Ready once, with the height of the first drawing — it used to announce 190 px, under
  // a manifest of 220, and then grow: a jump on every first load (1.2.300).
  var readied = false;
  function syncHeight() {
    if (!readied) {
      readied = true;
      requestAnimationFrame(function () {
        Homey.ready({ height: Math.ceil(card.getBoundingClientRect().bottom) + 16 });
      });
      return;
    }
    fitHeight(Homey, document.body);
  }

  function refresh() { poll.now(); }

  // The EMS recomputes only every TICK_MS (15 s), so a faster poll re-fetches identical
  // data; writes confirm themselves immediately via writeZones(). Stop entirely while
  // the dashboard is hidden and catch up on return.
  var poll = poller({
    ms: 15000,
    run: function () { return Homey.api('GET', '/status'); },
    onOk: render,
    onFail: function (first) {
      if (first) render({ error: 'unreachable' });
      else if (Date.now() >= errorUntil) statusText.textContent = T.stale;
    },
  });
}
</script>
</body>
</html>
