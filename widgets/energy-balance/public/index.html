<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Balance</title>
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  /* Sizes, colours and spacing from Homey's widget styling guide (--homey-*). Text is never
     smaller than --homey-font-size-small (1.2.300; it went down to 10 px). */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  #content { display: flex; flex-direction: column; gap: var(--homey-su-2); }

  .bar-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--homey-su-2);
    margin-bottom: var(--homey-su-1);
  }

  .bar-label {
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
    display: flex;
    align-items: center;
    gap: var(--homey-su-2);
    min-width: 0;
  }

  .bar-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .bar-value {
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    font-weight: var(--homey-font-weight-bold);
    color: var(--homey-text-color);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .bar-track {
    height: 6px;
    border-radius: 3px;
    background: var(--homey-line-color-light);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
    min-width: 0;
  }

  .hint {
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
    text-align: center;
  }

  .chip-row {
    display: flex;
    gap: var(--homey-su-2);
  }

  /* Chips are outlined, not tinted: Homey's styling guide draws boxes with its line
     colours, which follow light and dark mode by themselves. */
  .chip {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border: var(--homey-line);
    border-radius: var(--homey-border-radius-small);
    padding: var(--homey-su-1) var(--homey-su-3);
  }

  .chip-label {
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .metric-value {
    font-size: var(--homey-font-size-large);
    line-height: var(--homey-line-height-large);
    font-weight: var(--homey-font-weight-bold);
    font-variant-numeric: tabular-nums;
  }

  .chip-head { display: flex; align-items: center; gap: var(--homey-su-1); min-width: 0; }

  .batt-icon {
    width: var(--homey-icon-size-small, 14px);
    height: var(--homey-icon-size-small, 14px);
    flex-shrink: 0;
  }

  .batt-value {
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    font-weight: var(--homey-font-weight-bold);
    color: var(--homey-text-color);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* Skeleton */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.7; }
  }
  body.loading .bar-value,
  body.loading .metric-value,
  body.loading .batt-value {
    animation: skeleton-pulse 1.4s ease-in-out infinite;
  }
  /* Values the app has not confirmed for two polls are dimmed, not shown as live. */
  body.stale .bar-value, body.stale .metric-value, body.stale .batt-value { opacity: 0.45; }
</style>
</head>
<body class="homey-widget loading">

<div id="content">

<div class="bar-section">
  <div class="bar-header">
    <div class="bar-label">
      <div class="bar-dot" style="background:#F59E0B"></div>
      <span id="label-pv-today"></span>
    </div>
    <div class="bar-value" id="pv-val">—</div>
  </div>
  <div class="bar-track">
    <div class="bar-fill" id="pv-fill" style="width:0%;background:#F59E0B"></div>
  </div>
</div>

<div class="bar-section">
  <div class="bar-header">
    <div class="bar-label">
      <div class="bar-dot" style="background:var(--homey-color-green)"></div>
      <span id="label-export-today"></span>
    </div>
    <div class="bar-value" id="export-val">—</div>
  </div>
  <div class="bar-track">
    <div class="bar-fill" id="export-fill" style="width:0%;background:var(--homey-color-green)"></div>
  </div>
</div>

<div class="bar-section">
  <div class="bar-header">
    <div class="bar-label">
      <div class="bar-dot" style="background:var(--homey-color-red)"></div>
      <span id="label-import-today"></span>
    </div>
    <div class="bar-value" id="import-val">—</div>
  </div>
  <div class="bar-track">
    <div class="bar-fill" id="import-fill" style="width:0%;background:var(--homey-color-red)"></div>
  </div>
</div>

<div class="bar-section">
  <div class="bar-header">
    <div class="bar-label">
      <div class="bar-dot" style="background:var(--homey-color-blue)"></div>
      <span id="label-house-today"></span>
    </div>
    <div class="bar-value" id="house-val">—</div>
  </div>
  <div class="bar-track">
    <div class="bar-fill" id="house-fill" style="width:0%;background:var(--homey-color-blue)"></div>
  </div>
</div>

<div class="hint" id="baseline-hint" style="display:none"></div>

<!-- Self-consumption / self-sufficiency -->
<div class="chip-row">
  <div class="chip">
    <div class="chip-label" id="label-selfcons"></div>
    <div class="metric-value" id="sc-val">—</div>
  </div>
  <div class="chip">
    <div class="chip-label" id="label-selfsuff"></div>
    <div class="metric-value" id="autarkie-val">—</div>
  </div>
</div>
<!-- Battery charged / discharged (hidden without a battery figure) -->
<div class="chip-row" id="batt-row" style="display:none">
  <div class="chip">
    <div class="chip-head">
      <svg class="batt-icon" viewBox="0 0 24 24" fill="none" style="stroke:var(--homey-color-green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5,12 12,5 19,12"/>
      </svg>
      <span class="chip-label" id="label-charged"></span>
    </div>
    <span class="batt-value" id="batt-charged-val">—</span>
  </div>
  <div class="chip">
    <div class="chip-head">
      <svg class="batt-icon" viewBox="0 0 24 24" fill="none" style="stroke:#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <polyline points="19,12 12,19 5,12"/>
      </svg>
      <span class="chip-label" id="label-discharged"></span>
    </div>
    <span class="batt-value" id="batt-discharged-val">—</span>
  </div>
</div>

<div class="hint" id="status" style="display:none"></div>

</div>

<script>
// Language comes from the API payload (Homey i18n.getLanguage()), not
// navigator.language — see lib/widget-data.js.
var DICTS = (function() {
  var de = {
    pvToday:      'PV heute',
    exportToday:  'Einspeisung heute',
    importToday:  'Netzbezug heute',
    houseToday:   'Hausverbrauch heute',
    baseline:     'Tageswerte werden ab Mitternacht berechnet',
    selfCons:     'Eigenverbrauch',
    selfSuff:     'Autarkie',
    charged:      'Geladen',
    discharged:   'Entladen',
    unreachable:  'App antwortet nicht',
    stale:        '⚠ nicht aktuell',
  };
  var nl = {
    pvToday:      'PV vandaag',
    exportToday:  'Teruglevering vandaag',
    importToday:  'Netafname vandaag',
    houseToday:   'Verbruik vandaag',
    baseline:     'Dagwaarden worden berekend vanaf middernacht',
    selfCons:     'Eigenverbruik',
    selfSuff:     'Zelfvoorziening',
    charged:      'Geladen',
    discharged:   'Ontladen',
    unreachable:  'App reageert niet',
    stale:        '⚠ niet actueel',
  };
  var en = {
    pvToday:      'PV today',
    exportToday:  'Feed-in today',
    importToday:  'Grid import today',
    houseToday:   'Consumption today',
    baseline:     'Daily values calculated from midnight',
    selfCons:     'Self-consumption',
    selfSuff:     'Self-sufficiency',
    charged:      'Charged',
    discharged:   'Discharged',
    unreachable:  'App not responding',
    stale:        '⚠ not current',
  };
  return { de: de, nl: nl, en: en };
})();
function dictFor(code) {
  var l = String(code || '');
  return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
}
var activeLang = null;
var T = dictFor(navigator.language); // placeholder until the first payload arrives
function applyLang(code) {
  if (!code || code === activeLang) return false;
  activeLang = code;
  T = dictFor(code);
  applyStaticLabels();
  return true;
}

// Apply static labels
// Re-applied on a language change so static labels never stay in the
// language the widget first rendered in (mixed-language UI).
function applyStaticLabels() {
  document.getElementById('label-pv-today').textContent     = T.pvToday;
  document.getElementById('label-export-today').textContent = T.exportToday;
  document.getElementById('label-import-today').textContent = T.importToday;
  document.getElementById('label-house-today').textContent  = T.houseToday;
  document.getElementById('baseline-hint').textContent      = T.baseline;
  document.getElementById('label-selfcons').textContent     = T.selfCons;
  document.getElementById('label-selfsuff').textContent     = T.selfSuff;
  document.getElementById('label-charged').textContent      = T.charged;
  document.getElementById('label-discharged').textContent   = T.discharged;
}
applyStaticLabels();

/* ── Shared by this app's widgets (the same block in each — a widget cannot load another
   widget's files). fmtNum writes numbers the way the dashboard language does: 8,8 kW in
   German, 8.8 kW in English (1.2.300). poller asks one request at a time, says so when the
   first answer never comes, dims values after two missed answers instead of showing them
   as live, and rests while the dashboard is hidden. fitHeight follows content whose height
   changes, through Homey.setHeight, and only when it does. ───────────────────────────── */
var _nf = {};
function fmtNum(v, digits) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  var key = (activeLang || '') + '|' + digits;
  if (!_nf[key]) {
    try { _nf[key] = new Intl.NumberFormat(activeLang || undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
    catch (e) { _nf[key] = { format: function (x) { return x.toFixed(digits); } }; }
  }
  return _nf[key].format(v);
}
function poller(opts) {
  var busy = false, timer = null, loaded = false, misses = 0;
  function tick() {
    if (busy) return;
    busy = true;
    Promise.resolve().then(opts.run).then(function (data) {
      busy = false; misses = 0; loaded = true;
      document.body.classList.remove('stale');
      opts.onOk(data);
    }, function (err) {
      busy = false; misses++;
      if (!loaded) opts.onFail(true, err);
      else if (misses >= 2) { document.body.classList.add('stale'); opts.onFail(false, err); }
    });
  }
  function start() { if (!timer) timer = setInterval(tick, opts.ms); }
  function stop()  { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stop(); return; }
    tick(); start();
  });
  tick();
  if (!document.hidden) start();
  return { now: tick };
}
var _fitH = 0;
function fitHeight(Homey, el) {
  requestAnimationFrame(function () {
    var h = Math.ceil(el.getBoundingClientRect().bottom);
    if (h > 0 && h !== _fitH) { _fitH = h; Homey.setHeight(h); }
  });
}
/* ── end of the shared block ── */

// A missing figure is an em dash, as in every other widget. It used to be "…", which reads
// as "still loading" and stayed for good on plants that simply have no such counter.
// One decimal, as the yield widget writes the same figure (1.2.300).
function fmtKwh(v) {
  if (v === null || v === undefined) return '—';
  return fmtNum(v, 1) + ' kWh';
}

function barPct(val, maxVal) {
  if (maxVal <= 0) return 0;
  return Math.min(100, Math.max(0, (val / maxVal) * 100));
}

function pctColor(pct) {
  if (pct === null || pct === undefined) return '';
  if (pct >= 80) return 'var(--homey-color-green)';
  if (pct >= 50) return '#F59E0B';
  return 'var(--homey-color-red)';
}

function onHomeyReady(Homey) {
  var content = document.getElementById('content');
  var statusEl = document.getElementById('status');

  // Ready once, with the height of the first drawing; after that the height follows the
  // optional rows (baseline hint, battery) — a fixed 220 px cut the battery row off.
  var readied = false;
  function settle() {
    if (!readied) {
      readied = true;
      requestAnimationFrame(function () {
        Homey.ready({ height: Math.ceil(content.getBoundingClientRect().bottom) + 16 });
      });
    } else {
      fitHeight(Homey, document.body);
    }
  }

  function render(data) {
    document.body.classList.remove('loading');
    statusEl.style.display = 'none';

    var pv    = data.pvTodayKwh;
    var exp   = data.gridExportKwh;
    var imp   = data.gridImportKwh;
    var house = data.houseConsumptionKwh;
    var sc    = data.selfConsumptionPct;
    var aut   = data.selfSufficiencyPct;
    var chg   = data.battChargedKwh;
    var dchg  = data.battDischargedKwh;

    // Bar scale: max of all four values
    var vals   = [pv, exp, imp, house].filter(function(v) { return v !== null && v !== undefined; });
    var maxVal = vals.length > 0 ? Math.max.apply(null, vals.concat([0.1])) : 1;

    // The hint where a baseline is genuinely still missing — the app says so. An older app
    // without the flag falls back to the old guess.
    var needsBaseline = typeof data.awaitingBaseline === 'boolean'
      ? data.awaitingBaseline : (exp === null || imp === null);
    document.getElementById('baseline-hint').style.display = needsBaseline ? '' : 'none';

    document.getElementById('pv-val').textContent     = fmtKwh(pv);
    document.getElementById('pv-fill').style.width    = (pv    !== null ? barPct(pv,    maxVal) : 0) + '%';

    document.getElementById('export-val').textContent  = fmtKwh(exp);
    document.getElementById('export-fill').style.width = (exp   !== null ? barPct(exp,   maxVal) : 0) + '%';

    document.getElementById('import-val').textContent  = fmtKwh(imp);
    document.getElementById('import-fill').style.width = (imp   !== null ? barPct(imp,   maxVal) : 0) + '%';

    document.getElementById('house-val').textContent   = fmtKwh(house);
    document.getElementById('house-fill').style.width  = (house !== null ? barPct(house, maxVal) : 0) + '%';

    // Eigenverbrauch %
    var scEl = document.getElementById('sc-val');
    if (sc !== null && sc !== undefined) {
      scEl.textContent = fmtNum(sc, 0) + ' %';
      scEl.style.color = pctColor(sc);
    } else {
      scEl.textContent = '—';
      scEl.style.color = '';
    }

    // Autarkie %
    var autEl = document.getElementById('autarkie-val');
    if (aut !== null && aut !== undefined) {
      autEl.textContent = fmtNum(aut, 0) + ' %';
      autEl.style.color = pctColor(aut);
    } else {
      autEl.textContent = '—';
      autEl.style.color = '';
    }

    // Battery row: only show when at least one value available
    var battRow = document.getElementById('batt-row');
    if (chg !== null || dchg !== null) {
      battRow.style.display = '';
      document.getElementById('batt-charged-val').textContent   = fmtKwh(chg);
      document.getElementById('batt-discharged-val').textContent = fmtKwh(dchg);
    } else {
      battRow.style.display = 'none';
    }
    settle();
  }

  // Once a minute: these are day totals (1.2.300; it asked every 10 s).
  poller({
    ms: 60000,
    run: function () { return Homey.api('GET', '/', {}); },
    onOk: function (data) { applyLang(data && data.lang); if (data) render(data); },
    onFail: function (first) {
      document.body.classList.remove('loading');
      statusEl.textContent = first ? T.unreachable : T.stale;
      statusEl.style.display = '';
      settle();
    },
  });
}
</script>
</body>
</html>
