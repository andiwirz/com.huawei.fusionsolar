<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery Status</title>
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  /* Sizes, colours and spacing from Homey's widget styling guide (--homey-*). The state of
     charge uses the largest size the guide has for numbers, 32 px (it was 36 px); no text is
     smaller than --homey-font-size-small; and the icon pulses instead of glowing — Homey's
     frame carries the only shadow on the dashboard (1.2.300). */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  #content { display: flex; flex-direction: column; gap: var(--homey-su-3); }

  /* --- SoC row --- */
  .soc-row {
    display: flex;
    align-items: center;
    gap: var(--homey-su-3);
  }

  .soc-left {
    display: flex;
    align-items: center;
    gap: var(--homey-su-2);
    min-width: 92px;
  }

  .soc-icon {
    width: var(--homey-icon-size-medium, 20px);
    height: var(--homey-icon-size-medium, 20px);
    flex-shrink: 0;
  }

  .soc-number {
    font-size: var(--homey-font-size-xxlarge);
    line-height: var(--homey-line-height-xxlarge);
    font-weight: var(--homey-font-weight-bold);
    color: var(--homey-text-color);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .soc-bar-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--homey-su-1);
  }

  .soc-track {
    height: 12px;
    border-radius: 6px;
    background: var(--homey-line-color-light);
    overflow: hidden;
  }

  .soc-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.4s ease;
    background: var(--homey-color-green);
  }

  .soc-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--homey-su-2);
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
  }

  .soc-status { color: var(--homey-text-color-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .soc-remaining { color: var(--homey-text-color); font-weight: var(--homey-font-weight-medium); white-space: nowrap; }

  /* --- Power row --- */
  .power-row {
    display: flex;
    align-items: center;
    gap: var(--homey-su-2);
  }

  .power-icon {
    width: var(--homey-icon-size-medium, 20px);
    height: var(--homey-icon-size-medium, 20px);
    flex-shrink: 0;
  }

  .power-value {
    font-size: var(--homey-font-size-large);
    line-height: var(--homey-line-height-large);
    font-weight: var(--homey-font-weight-bold);
    color: var(--homey-text-color);
    font-variant-numeric: tabular-nums;
  }

  .power-label {
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
  }

  /* --- Stats row --- */
  .stats-row {
    display: flex;
    gap: var(--homey-su-2);
  }

  /* Outlined, not tinted: the guide draws boxes with its line colours. */
  .row-tile {
    flex: 1;
    min-width: 0;
    border: var(--homey-line);
    border-radius: var(--homey-border-radius-small);
    padding: var(--homey-su-1) var(--homey-su-3);
    display: flex;
    flex-direction: column;
  }

  .stat-label {
    display: flex;
    align-items: center;
    gap: var(--homey-su-1);
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-icon {
    width: var(--homey-icon-size-small, 14px);
    height: var(--homey-icon-size-small, 14px);
    flex-shrink: 0;
  }

  .stat-value {
    font-size: var(--homey-font-size-default);
    line-height: var(--homey-line-height-default);
    font-weight: var(--homey-font-weight-bold);
    color: var(--homey-text-color);
    font-variant-numeric: tabular-nums;
  }

  /* --- Skeleton --- */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.7; }
  }
  body.loading .soc-number,
  body.loading .power-value,
  body.loading .stat-value {
    animation: skeleton-pulse 1.4s ease-in-out infinite;
  }
  /* Values the app has not confirmed for two polls are dimmed, not shown as live. */
  body.stale .soc-number, body.stale .power-value, body.stale .stat-value { opacity: 0.45; }

  /* --- Power icon: a slow pulse while energy flows --- */
  @keyframes flow-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.45; }
  }
  .pulsing { animation: flow-pulse 2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .pulsing { animation: none; } }
</style>
</head>
<body class="homey-widget loading">

<div id="content">
<div class="soc-row">
  <div class="soc-left">
    <svg class="soc-icon" id="soc-batt-icon" viewBox="0 0 24 24" fill="none" style="stroke:var(--homey-color-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="16" height="10" rx="2"/>
      <line x1="22" y1="10" x2="22" y2="14"/>
    </svg>
    <div class="soc-number" id="soc-num">—</div>
  </div>
  <div class="soc-bar-wrap">
    <div class="soc-track">
      <div class="soc-fill" id="soc-fill" style="width:0%"></div>
    </div>
    <div class="soc-meta">
      <div class="soc-status" id="batt-status">—</div>
      <div class="soc-remaining" id="batt-remaining"></div>
    </div>
  </div>
</div>

<div class="power-row">
  <svg class="power-icon" id="power-icon" viewBox="0 0 24 24" fill="none" style="stroke:var(--homey-text-color-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
  </svg>
  <span class="power-value" id="power-val">—</span>
  <span class="power-label" id="power-dir"></span>
</div>

<div class="stats-row">
  <div class="row-tile">
    <div class="stat-label">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" style="stroke:var(--homey-color-green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5,12 12,5 19,12"/>
      </svg>
      <span id="label-charged-today"></span>
    </div>
    <div class="stat-value" id="charged-val">—</div>
  </div>
  <div class="row-tile">
    <div class="stat-label">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" style="stroke:#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <polyline points="19,12 12,19 5,12"/>
      </svg>
      <span id="label-discharged-today"></span>
    </div>
    <div class="stat-value" id="discharged-val">—</div>
  </div>
</div>
</div>

<script>
// Language comes from the API payload (Homey i18n.getLanguage()), not
// navigator.language — see widgets/ems-device/api.js.
var DICTS = (function() {
  var de = {
    noBattery:   'Keine Batterie',
    unreachable: 'Batterie nicht erreichbar',
    appDown:     'App antwortet nicht',
    stale:       '⚠ nicht aktuell',
    charging:    'Laden',
    discharging: 'Entladen',
    standby:     'Standby',
    remaining:   'noch ',
    chargedToday:    'Heute geladen',
    dischargedToday: 'Heute entladen',
    statusMap: { charging: 'Laden', discharging: 'Entladen', standby: 'Standby', running: 'In Betrieb',
                 offline: 'Offline', fault: 'Störung', sleep: 'Ruhemodus', starting: 'Startet',
                 off: 'Aus', testing: 'Test' },
  };
  var nl = {
    noBattery:   'Geen batterij',
    unreachable: 'Batterij niet bereikbaar',
    appDown:     'App reageert niet',
    stale:       '⚠ niet actueel',
    charging:    'Laden',
    discharging: 'Ontladen',
    standby:     'Standby',
    remaining:   'nog ',
    chargedToday:    'Vandaag geladen',
    dischargedToday: 'Vandaag ontladen',
    statusMap: { charging: 'Laden', discharging: 'Ontladen', standby: 'Standby', running: 'In bedrijf',
                 offline: 'Offline', fault: 'Storing', sleep: 'Slaapstand', starting: 'Opstarten',
                 off: 'Uit', testing: 'Test' },
  };
  var en = {
    noBattery:   'No battery',
    unreachable: 'Battery unreachable',
    appDown:     'App not responding',
    stale:       '⚠ not current',
    charging:    'Charging',
    discharging: 'Discharging',
    standby:     'Standby',
    remaining:   '',
    chargedToday:    'Charged today',
    dischargedToday: 'Discharged today',
    statusMap: { charging: 'Charging', discharging: 'Discharging', standby: 'Standby', running: 'Running',
                 offline: 'Offline', fault: 'Fault', sleep: 'Sleep mode', starting: 'Starting',
                 off: 'Off', testing: 'Testing' },
  };
  return { de: de, nl: nl, en: en };
})();
function dictFor(code) {
  var l = String(code || '');
  return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
}
var activeLang = null;
var T = dictFor(navigator.language); // placeholder until the first payload arrives
function applyLang(code) {
  if (!code || code === activeLang) return false;
  activeLang = code;
  T = dictFor(code);
  applyStaticLabels();
  return true;
}

// Re-applied on a language change so static labels never stay in the
// language the widget first rendered in (mixed-language UI).
function applyStaticLabels() {
  document.getElementById('label-charged-today').textContent    = T.chargedToday;
  document.getElementById('label-discharged-today').textContent = T.dischargedToday;
}
applyStaticLabels();

/* ── Shared by this app's widgets (the same block in each — a widget cannot load another
   widget's files). fmtNum writes numbers the way the dashboard language does: 8,8 kW in
   German, 8.8 kW in English (1.2.300). poller asks one request at a time, says so when the
   first answer never comes, dims values after two missed answers instead of showing them
   as live, and rests while the dashboard is hidden. fitHeight follows content whose height
   changes, through Homey.setHeight, and only when it does. ───────────────────────────── */
var _nf = {};
function fmtNum(v, digits) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  var key = (activeLang || '') + '|' + digits;
  if (!_nf[key]) {
    try { _nf[key] = new Intl.NumberFormat(activeLang || undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
    catch (e) { _nf[key] = { format: function (x) { return x.toFixed(digits); } }; }
  }
  return _nf[key].format(v);
}
function poller(opts) {
  var busy = false, timer = null, loaded = false, misses = 0;
  function tick() {
    if (busy) return;
    busy = true;
    Promise.resolve().then(opts.run).then(function (data) {
      busy = false; misses = 0; loaded = true;
      document.body.classList.remove('stale');
      opts.onOk(data);
    }, function (err) {
      busy = false; misses++;
      if (!loaded) opts.onFail(true, err);
      else if (misses >= 2) { document.body.classList.add('stale'); opts.onFail(false, err); }
    });
  }
  function start() { if (!timer) timer = setInterval(tick, opts.ms); }
  function stop()  { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stop(); return; }
    tick(); start();
  });
  tick();
  if (!document.hidden) start();
  return { now: tick };
}
var _fitH = 0;
function fitHeight(Homey, el) {
  requestAnimationFrame(function () {
    var h = Math.ceil(el.getBoundingClientRect().bottom);
    if (h > 0 && h !== _fitH) { _fitH = h; Homey.setHeight(h); }
  });
}
/* ── end of the shared block ── */

function fmtKwh(v) {
  if (v === null || v === undefined) return '—';
  return fmtNum(v, 1) + ' kWh';
}
function fmtW(w) {
  if (w === null || w === undefined) return '—';
  var abs = Math.abs(w);
  if (abs >= 1000) return fmtNum(abs / 1000, 1) + ' kW';
  return fmtNum(Math.round(abs), 0) + ' W';
}
function fmtRemaining(hours) {
  if (hours === null || !isFinite(hours) || hours <= 0) return '';
  var h = Math.floor(hours);
  var m = Math.round((hours - h) * 60);
  if (m === 60) { h++; m = 0; }
  if (h > 99) return '';  // unrealistically long
  return h > 0 ? T.remaining + h + 'h ' + m + 'min' : T.remaining + m + 'min';
}

function onHomeyReady(Homey) {
  // The same height as the manifest: one height, no jump on the first load.
  Homey.ready({ height: 178 });

  // Reported by gsommer as issue #33: charging at 2 kW from 50 %, a 15 kWh battery was
  // told it would be full in a little over an hour. It was not the arithmetic. This line
  // used to read "var capacityKwh = 5", and the manifest handed every widget that 5 as the
  // setting's default — the capacity of a single LUNA2000 module. Three modules, and the
  // estimate came out a third of the truth, stated to the minute.
  //
  // Five kilowatt-hours is not a measurement of anything. A capacity nobody has established
  // is unknown, and the honest thing to draw for an unknown is nothing.
  var settingCapacityKwh = null;
  try {
    var settings = Homey.getSettings();
    var typed = settings ? parseFloat(settings.battery_capacity_kwh) : NaN;
    if (isFinite(typed) && typed > 0) settingCapacityKwh = typed;
  } catch(e) {}

  function render(data) {
    document.body.classList.remove('loading');

    // No battery device — or one that does not answer, which is not the same thing and
    // used to read "No battery" too (1.2.300).
    if (data.soc === null && data.powerW === null) {
      document.getElementById('soc-num').textContent      = '—';
      document.getElementById('soc-fill').style.width     = '0%';
      document.getElementById('batt-status').textContent  = data.unreachable ? T.unreachable : T.noBattery;
      document.getElementById('batt-remaining').textContent = '';
      document.getElementById('power-val').textContent    = '—';
      document.getElementById('power-dir').textContent    = '';
      document.getElementById('charged-val').textContent  = '—';
      document.getElementById('discharged-val').textContent = '—';
      return;
    }

    // SoC
    var soc = data.soc;
    var socColor = 'var(--homey-color-green)';
    if (soc !== null && soc !== undefined) {
      document.getElementById('soc-num').textContent = fmtNum(Math.round(soc), 0) + ' %';
      document.getElementById('soc-fill').style.width = Math.min(100, Math.max(0, soc)) + '%';
      if      (soc < 20) socColor = 'var(--homey-color-red)';
      else if (soc < 40) socColor = '#F97316';
      else               socColor = 'var(--homey-color-green)';
      document.getElementById('soc-fill').style.background = socColor;
      document.getElementById('soc-batt-icon').style.stroke = socColor;
    } else {
      document.getElementById('soc-num').textContent = '—';
    }

    document.getElementById('batt-status').textContent = (data.status && T.statusMap[data.status]) ? T.statusMap[data.status] : (data.status || '—');

    // Remaining time. The battery's own figure wins: it is the hardware talking, where
    // the setting is somebody's recollection. The setting stays for batteries that report
    // nothing, and when neither exists the line stays empty.
    var capacityKwh = (typeof data.capacityKwh === 'number' && isFinite(data.capacityKwh) && data.capacityKwh > 0)
      ? data.capacityKwh
      : settingCapacityKwh;
    // A battery does not charge to 100 % or discharge to 0 %, and asked by gsommer in
    // issue #33 whether the estimate knows that. It does now. Three limits, each falling
    // back on its own: a LUNA2000 over Modbus reports all of them, an EMMA battery only the
    // reserve, an OpenAPI plant none — and a battery that reports none counts 0 to 100 as
    // before rather than losing the line.
    //
    // The floor is the higher of the discharge cutoff and the backup reserve. Taking the
    // reserve at face value is the careful direction, not the certain one: whether the
    // inverter really holds it depends on backup operation being active, which is a register
    // we do not read. Wrong that way the estimate comes out short — and a countdown that
    // says three hours and gives four is a better mistake than one that says four and
    // gives three.
    var num = function(v) { return (typeof v === 'number' && isFinite(v)) ? v : null; };
    var ceiling = num(data.socCeiling);
    if (ceiling === null) ceiling = 100;
    var floor = Math.max(num(data.socFloor) || 0, num(data.socReserve) || 0);

    var pw = data.powerW;
    var remaining = '';
    // The capacityKwh test is belt and braces, not load-bearing: fmtRemaining already returns
    // an empty string for anything that is not a positive number of hours, so a missing
    // capacity draws nothing either way. It stays because reading the condition should not
    // require knowing that.
    // An EMMA battery says itself how many kWh are left to full and to empty; that wins
    // over any capacity, reported or typed (1.2.300).
    var toFull = num(data.toFullKwh), toEmpty = num(data.toEmptyKwh);
    if (pw !== null && pw > 50 && toFull !== null) {
      remaining = fmtRemaining(toFull / (pw / 1000));
    } else if (pw !== null && pw < -50 && toEmpty !== null) {
      remaining = fmtRemaining(toEmpty / (Math.abs(pw) / 1000));
    } else if (soc !== null && pw !== null && capacityKwh) {
      // Both Math.max(0, ...) guards are the same kind of belt and braces as the test above:
      // a battery sitting outside its own window — somebody lowered the maximum while it was
      // full, or raised the reserve above where it stands — produces a negative distance, and
      // fmtRemaining turns every non-positive hour count into an empty string anyway. Clamping
      // first says "there is no time to show here" at the place where the distance is measured,
      // instead of leaving it to be discovered two lines later.
      if (pw > 50) {
        var remainKwh = Math.max(0, (ceiling - soc) / 100) * capacityKwh;
        remaining = fmtRemaining(remainKwh / (pw / 1000));
      } else if (pw < -50) {
        var availKwh = Math.max(0, (soc - floor) / 100) * capacityKwh;
        remaining = fmtRemaining(availKwh / (Math.abs(pw) / 1000));
      }
    }
    document.getElementById('batt-remaining').textContent = remaining;

    // Power
    document.getElementById('power-val').textContent = fmtW(pw);
    var powerIcon = document.getElementById('power-icon');
    var powerDir  = document.getElementById('power-dir');
    if (pw > 50) {
      powerIcon.style.stroke = 'var(--homey-color-green)';
      powerIcon.setAttribute('class', 'power-icon pulsing');
      powerDir.textContent = T.charging;
      powerDir.style.color = 'var(--homey-color-green)';
    } else if (pw < -50) {
      powerIcon.style.stroke = '#F97316';
      powerIcon.setAttribute('class', 'power-icon pulsing');
      powerDir.textContent = T.discharging;
      powerDir.style.color = '#F97316';
    } else {
      powerIcon.style.stroke = 'var(--homey-text-color-light)';
      powerIcon.setAttribute('class', 'power-icon');
      powerDir.textContent = T.standby;
      powerDir.style.color = '';
    }

    document.getElementById('charged-val').textContent    = fmtKwh(data.todayChargedKwh);
    document.getElementById('discharged-val').textContent = fmtKwh(data.todayDischargedKwh);
  }

  // Every 15 s: a battery's readings change once a minute at most on a default Modbus poll,
  // and every five minutes from the cloud (1.2.300; it asked every 10 s).
  poller({
    ms: 15000,
    run: function () { return Homey.api('GET', '/', {}); },
    onOk: function (data) { applyLang(data && data.lang); if (data) render(data); },
    onFail: function (first) {
      document.body.classList.remove('loading');
      document.getElementById('batt-status').textContent = first ? T.appDown : T.stale;
    },
  });
}
</script>
</body>
</html>
