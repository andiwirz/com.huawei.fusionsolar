<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  /* Colors come from Homey's own --homey-* variables (see the widget styling
     guide), which the dashboard sets according to the user's light/dark theme
     choice — NOT the OS-level prefers-color-scheme, which widgets don't get to
     read reliably. Never hardcode light/dark pairs here. The bar hues below
     (green→red for price) are content-driven, not theme colors, same approach
     as the settings page's own price-forecast chart. */
  /* Sizes and spacing from Homey's widget styling guide too (1.2.300): no text below
     --homey-font-size-small (the axes were 8 px), no second card inside Homey's frame. */
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--homey-text-color); }
  .card { display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: var(--homey-su-2); }
  .title {
    font-size: var(--homey-font-size-default); line-height: var(--homey-line-height-default);
    font-weight: var(--homey-font-weight-bold);
  }
  .refresh-btn {
    border: var(--homey-line); background: transparent; color: var(--homey-text-color-light);
    width: 32px; height: 32px; border-radius: 50%; font-size: var(--homey-font-size-default); line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .refresh-btn:focus-visible { outline: 2px solid var(--homey-color-blue); outline-offset: 2px; }
  .refresh-btn:active { transform: scale(0.92); }
  .refresh-btn.spin { animation: emsfc-spin 0.6s linear; }
  @keyframes emsfc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh-btn.spin { animation: none; } }

  .section { margin-top: var(--homey-su-3); }
  .section + .section { padding-top: var(--homey-su-3); border-top: var(--homey-line); }
  .sec-label {
    font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
    font-weight: var(--homey-font-weight-bold); color: var(--homey-text-color);
  }
  .sec-status, .minmax-row, .axis-cell, .flat-unit, .sec-no-data, .no-data {
    font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
  }
  .sec-status { min-height: var(--homey-line-height-small); }
  .sec-status.warn { color: var(--homey-text-color-warning, #f5a524); }

  .minmax-row { display: flex; justify-content: space-between; margin: var(--homey-su-2) 0 var(--homey-su-1); font-variant-numeric: tabular-nums; }
  /* Room above the bars for the "now" figure. */
  .chart { display: flex; align-items: flex-end; height: 56px; gap: 1px; position: relative; }
  .bar { flex: 1; min-width: 2px; border-radius: 1px 1px 0 0; position: relative; }
  /* The figure for now sits between max and min, in the colour of its bar. Above the bar it
     was cut off at the left edge, where "now" always is. */
  .minmax-row .now { color: var(--homey-color-blue); font-weight: var(--homey-font-weight-bold); }
  .axis-row { display: flex; gap: 1px; margin-top: var(--homey-su-1); }
  .axis-cell { flex: 1; min-width: 2px; text-align: center; white-space: nowrap; overflow: visible; }

  /* Flat, single-value display for the price section in "fixed"/"variable" tariff
     mode, where there's no future timeline to chart — just the one current price. */
  .flat-row { display: flex; align-items: baseline; gap: var(--homey-su-2); padding: var(--homey-su-2) 0 var(--homey-su-1); }
  .flat-value {
    font-size: var(--homey-font-size-large); line-height: var(--homey-line-height-large);
    font-weight: var(--homey-font-weight-bold); font-variant-numeric: tabular-nums;
  }

  .sec-no-data { text-align: center; padding: var(--homey-su-4) var(--homey-su-1); }
  .no-data { text-align: center; padding: var(--homey-su-4) var(--homey-su-1); }
  body.stale .flat-value, body.stale .sec-status { opacity: 0.45; }
</style>
</head>
<body class="homey-widget">
  <div class="card" id="card">
    <div class="no-data" id="noData" style="display:none"></div>
    <div id="content" style="display:none">
      <div class="head">
        <div class="title" id="title">—</div>
        <button class="refresh-btn" id="refreshBtn" type="button" title="">↻</button>
      </div>

      <div class="section">
        <div class="sec-label" id="solarLabel">—</div>
        <div class="sec-status" id="solarStatus"></div>
        <div id="solarBody">
          <div class="minmax-row" id="solarMinMax"></div>
          <div class="chart" id="solarChart"></div>
          <div class="axis-row" id="solarAxis"></div>
        </div>
        <div class="sec-no-data" id="solarNoData" style="display:none"></div>
      </div>

      <div class="section">
        <div class="sec-label" id="priceLabel">—</div>
        <div class="sec-status" id="priceStatus"></div>
        <div class="flat-row" id="priceFlat" style="display:none">
          <div class="flat-value" id="priceFlatValue">—</div>
          <div class="flat-unit" id="priceFlatUnit"></div>
        </div>
        <div id="priceBody">
          <div class="minmax-row" id="priceMinMax"></div>
          <div class="chart" id="priceChart"></div>
          <div class="axis-row" id="priceAxis"></div>
        </div>
        <div class="sec-no-data" id="priceNoData" style="display:none"></div>
      </div>
    </div>
  </div>

<script type="text/javascript">
function onHomeyReady(Homey) {
  // Language comes from the API payload (Homey's own i18n.getLanguage()), not from
  // navigator.language — that is the browser/OS language and can differ from the Homey
  // app language. See widgets/ems-device/api.js for the full rationale.
  var DICTS = (function () {
    var de = {
      title: 'EMS Prognose', unreachable: 'EMS-Gerät nicht erreichbar',
      solarLabel: 'Solar (Solcast)', priceLabel: 'Strompreis',
      now: 'jetzt', slotsAhead: 'Slot(s) voraus', updated: 'aktualisiert', minAgo: 'Min. her',
      neverUpdated: 'nie aktualisiert', staleWarn: '⚠ veraltet',
      notConfiguredSolar: 'Solcast nicht konfiguriert', notConfiguredPrice: 'Preis nicht konfiguriert',
      solarError: 'Solcast-Abruf fehlgeschlagen', priceModeZones: 'Tarifzonen',
      noDataYet: 'Noch keine Prognosedaten', refresh: 'Aktualisieren',
      priceModeFixed: 'Fixpreis', priceModeVariable: 'Live-Preis (Flow)', priceModeDual: 'Hoch-/Niedertarif',
    };
    var nl = {
      title: 'EMS-prognose', unreachable: 'EMS-apparaat niet bereikbaar',
      solarLabel: 'Zon (Solcast)', priceLabel: 'Stroomprijs',
      now: 'nu', slotsAhead: 'slot(en) vooruit', updated: 'bijgewerkt', minAgo: 'min geleden',
      neverUpdated: 'nooit bijgewerkt', staleWarn: '⚠ verouderd',
      notConfiguredSolar: 'Solcast niet geconfigureerd', notConfiguredPrice: 'Prijs niet geconfigureerd',
      solarError: 'Solcast-ophalen mislukt', priceModeZones: 'Tariefzones',
      noDataYet: 'Nog geen prognosegegevens', refresh: 'Vernieuwen',
      priceModeFixed: 'Vaste prijs', priceModeVariable: 'Live prijs (flow)', priceModeDual: 'Hoog-/laagtarief',
    };
    var en = {
      title: 'EMS Forecast', unreachable: 'EMS device unreachable',
      solarLabel: 'Solar (Solcast)', priceLabel: 'Electricity price',
      now: 'now', slotsAhead: 'slot(s) ahead', updated: 'updated', minAgo: 'min ago',
      neverUpdated: 'never updated', staleWarn: '⚠ stale',
      notConfiguredSolar: 'Solcast not configured', notConfiguredPrice: 'Price not configured',
      solarError: 'Solcast fetch failed', priceModeZones: 'Tariff zones',
      noDataYet: 'No forecast data yet', refresh: 'Refresh',
      priceModeFixed: 'Fixed price', priceModeVariable: 'Live price (flow)', priceModeDual: 'Low/high tariff',
    };
    return { de: de, nl: nl, en: en };
  })();
  function dictFor(code) {
    var l = String(code || '');
    return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
  }
  var activeLang = null;
  var T = dictFor(navigator.language); // placeholder until the first payload arrives
  function applyLang(code) {
    if (!code || code === activeLang) return false;
    activeLang = code;
    T = dictFor(code);
    // Static chrome is written once at startup — refresh it on a language change.
    titleEl.textContent    = T.title;
    refreshBtn.title       = T.refresh;
    solarLabel.textContent = T.solarLabel;
    priceLabel.textContent = T.priceLabel;
    return true;
  }

  /* ── Shared by this app's widgets (the same block in each — a widget cannot load another
   widget's files). fmtNum writes numbers the way the dashboard language does: 8,8 kW in
   German, 8.8 kW in English (1.2.300). poller asks one request at a time, says so when the
   first answer never comes, dims values after two missed answers instead of showing them
   as live, and rests while the dashboard is hidden. fitHeight follows content whose height
   changes, through Homey.setHeight, and only when it does. ───────────────────────────── */
var _nf = {};
function fmtNum(v, digits) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  var key = (activeLang || '') + '|' + digits;
  if (!_nf[key]) {
    try { _nf[key] = new Intl.NumberFormat(activeLang || undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
    catch (e) { _nf[key] = { format: function (x) { return x.toFixed(digits); } }; }
  }
  return _nf[key].format(v);
}
function poller(opts) {
  var busy = false, timer = null, loaded = false, misses = 0;
  function tick() {
    if (busy) return;
    busy = true;
    Promise.resolve().then(opts.run).then(function (data) {
      busy = false; misses = 0; loaded = true;
      document.body.classList.remove('stale');
      opts.onOk(data);
    }, function (err) {
      busy = false; misses++;
      if (!loaded) opts.onFail(true, err);
      else if (misses >= 2) { document.body.classList.add('stale'); opts.onFail(false, err); }
    });
  }
  function start() { if (!timer) timer = setInterval(tick, opts.ms); }
  function stop()  { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stop(); return; }
    tick(); start();
  });
  tick();
  if (!document.hidden) start();
  return { now: tick };
}
var _fitH = 0;
function fitHeight(Homey, el) {
  requestAnimationFrame(function () {
    var h = Math.ceil(el.getBoundingClientRect().bottom);
    if (h > 0 && h !== _fitH) { _fitH = h; Homey.setHeight(h); }
  });
}
/* ── end of the shared block ── */

  // A short buzz on a tap, where the device has it (Homey's widget API, 1.2.300).
  function haptic() { try { Homey.hapticFeedback(); } catch (e) {} }

  var card       = document.getElementById('card');
  var noData     = document.getElementById('noData');
  var content    = document.getElementById('content');
  var titleEl    = document.getElementById('title');
  var refreshBtn = document.getElementById('refreshBtn');

  var solarLabel  = document.getElementById('solarLabel');
  var solarStatus = document.getElementById('solarStatus');
  var solarBody   = document.getElementById('solarBody');
  var solarNoData = document.getElementById('solarNoData');
  var solarMinMax = document.getElementById('solarMinMax');
  var solarChart  = document.getElementById('solarChart');
  var solarAxis   = document.getElementById('solarAxis');

  var priceLabel     = document.getElementById('priceLabel');
  var priceStatus    = document.getElementById('priceStatus');
  var priceFlat      = document.getElementById('priceFlat');
  var priceFlatValue = document.getElementById('priceFlatValue');
  var priceFlatUnit  = document.getElementById('priceFlatUnit');
  var priceBody      = document.getElementById('priceBody');
  var priceNoData    = document.getElementById('priceNoData');
  var priceMinMax    = document.getElementById('priceMinMax');
  var priceChart     = document.getElementById('priceChart');
  var priceAxis      = document.getElementById('priceAxis');

  titleEl.textContent      = T.title;
  refreshBtn.title         = T.refresh;
  solarLabel.textContent   = T.solarLabel;
  priceLabel.textContent   = T.priceLabel;

  function showNoData(msg) {
    content.style.display = 'none';
    noData.style.display  = 'block';
    noData.textContent    = msg;
  }

  // One line: how old the data is. The figure for now moved next to max and min, and the
  // slot count said little — the status ran over two lines on a phone (1.2.300).
  function statusLine(nowText, count, ageMin, stale) {
    var parts = [];
    parts.push(ageMin == null ? T.neverUpdated : (T.updated + ' ' + ageMin + ' ' + T.minAgo));
    if (stale) parts.push(T.staleWarn);
    return parts.join(' · ');
  }

  // Generic bar-chart renderer shared by both sections — mirrors the settings
  // page's own price-forecast chart (App Settings → Electricity Price).
  // slots: [{ start, end, value }] ascending; colorFn(pct 0..100, isNow) -> css color.
  function renderChart(chartEl, axisEl, minMaxEl, slots, nowMs, opts) {
    if (!slots.length) {
      chartEl.innerHTML = '';
      axisEl.innerHTML = '';
      minMaxEl.innerHTML = '<span>' + T.noDataYet + '</span><span></span>';
      return;
    }
    var values = slots.map(function (s) { return s.value; });
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    var range = (max - min) || 1;

    var nowSlot = null;
    slots.forEach(function (s) { if (s.start <= nowMs && nowMs < s.end) nowSlot = s; });
    minMaxEl.innerHTML =
      '<span>▲ ' + opts.formatValue(max) + '</span>' +
      (nowSlot ? '<span class="now">' + esc(T.now + ' ' + opts.formatValue(nowSlot.value)) + '</span>' : '') +
      '<span>▼ ' + opts.formatValue(min) + '</span>';

    var barsHtml = '';
    slots.forEach(function (s) {
      var pct    = Math.round(((s.value - min) / range) * 100);
      var height = Math.max(6, pct);
      var isNow  = s.start <= nowMs && nowMs < s.end;
      var bg     = opts.colorFn(pct, isNow);
      var title  = opts.formatLabel(s, isNow);
      barsHtml += '<div class="bar" title="' + esc(title) + '" style="height:' + height + '%;background:' + bg + '">' +
        '</div>';
    });
    chartEl.innerHTML = barsHtml;

    // As many hour labels as fit at the guide's text size: one every ~36 px.
    var slotPx = (chartEl.clientWidth || 300) / slots.length;
    var labelInterval = Math.max(1, Math.ceil(36 / Math.max(1, slotPx)));
    var lastIdx = slots.length - 1;
    var axisHtml = '';
    slots.forEach(function (s, i) {
      var isRegular = i % labelInterval === 0 && i !== lastIdx;
      var tooCloseToEnd = isRegular && (lastIdx - i) < labelInterval;
      var showLabel = (isRegular && !tooCloseToEnd) || i === lastIdx;
      var txt = showLabel ? esc(String(new Date(s.start).getHours())) : '';
      axisHtml += '<div class="axis-cell">' + txt + '</div>';
    });
    axisEl.innerHTML = axisHtml;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // "Not configured" only when it is not. Any fetch error used to be reported that way and
  // hid a perfectly good forecast — during a rate-limit pause of up to six hours, or when
  // one of two sites failed (1.2.299). An error now shows as a warning beside the chart,
  // or in its place when there is nothing to draw.
  function renderSolar(pv, nowMs) {
    var future = pv ? (pv.slots || []).filter(function (s) { return s.end > nowMs; }) : [];
    if (!pv || !pv.configured || (pv.error && !future.length)) {
      solarBody.style.display = 'none';
      solarNoData.style.display = 'block';
      solarNoData.textContent = (pv && pv.configured) ? T.solarError : T.notConfiguredSolar;
      solarStatus.textContent = '';
      return;
    }
    solarBody.style.display = '';
    solarNoData.style.display = 'none';
    solarStatus.className = 'sec-status' + ((pv.stale || pv.error) ? ' warn' : '');
    solarStatus.textContent = statusLine(
      pv.nowKw != null ? fmtNum(pv.nowKw, 2) + ' kW' : null,
      future.length, pv.ageMin, pv.stale
    ) + (pv.error ? ' · ⚠ ' + T.solarError : '');
    var slots = (pv.slots || [])
      .filter(function (s) { return s.end > nowMs; })
      .slice(0, 48)
      .map(function (s) { return { start: s.end - s.h * 3600000, end: s.end, value: s.kw }; });
    renderChart(solarChart, solarAxis, solarMinMax, slots, nowMs, {
      formatValue: function (v) { return fmtNum(v, 2) + ' kW'; },
      formatLabel: function (s, isNow) {
        return new Date(s.start).toLocaleString(activeLang || undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' }) +
          ': ' + fmtNum(s.value, 2) + ' kW' + (isNow ? ' (' + T.now + ')' : '');
      },
      colorFn: function (pct, isNow) {
        return isNow ? 'var(--homey-color-blue, #007aff)' : 'var(--homey-color-orange, #f5a524)';
      },
    });
  }

  // Follows whatever tariff model is actually configured under App Settings →
  // Electricity Price (lib/ems/price.js#getEmsPriceStatus): fixed/variable show the
  // single current value (no chart — there's no future to show), dual shows a 24h
  // hourly timeline built from the high/low windows, forecast shows the real D10
  // price-forecast chart, unchanged from before.
  function showPriceNoData(msg) {
    priceFlat.style.display = 'none';
    priceBody.style.display = 'none';
    priceNoData.style.display = 'block';
    priceNoData.textContent = msg;
    priceStatus.textContent = '';
  }

  function showPriceFlat(value, unit, modeLabel) {
    priceBody.style.display = 'none';
    priceNoData.style.display = 'none';
    priceFlat.style.display = 'flex';
    priceFlatValue.textContent = value;
    priceFlatUnit.textContent = unit;
    priceStatus.className = 'sec-status';
    priceStatus.textContent = modeLabel;
  }

  function showPriceChart(slots, currency, statusText, warn) {
    priceFlat.style.display = 'none';
    priceBody.style.display = '';
    priceNoData.style.display = 'none';
    priceStatus.className = 'sec-status' + (warn ? ' warn' : '');
    priceStatus.textContent = statusText;
    renderChart(priceChart, priceAxis, priceMinMax, slots, Date.now(), {
      formatValue: function (v) { return fmtNum(v, 3) + ' ' + currency; },
      formatLabel: function (s, isNow) {
        return new Date(s.start).toLocaleString(activeLang || undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' }) +
          ': ' + fmtNum(s.value, 3) + ' ' + currency + (isNow ? ' (' + T.now + ')' : '');
      },
      colorFn: function (pct, isNow) {
        if (isNow) return 'var(--homey-color-blue, #007aff)';
        var hue = Math.round(120 - (pct / 100) * 120); // 120=green (cheap) → 0=red (expensive)
        return 'hsl(' + hue + ',65%,50%)';
      },
    });
  }

  function renderPrice(price, nowMs) {
    if (!price || price.error) { showPriceNoData(T.notConfiguredPrice); return; }
    var mode = price.mode || 'forecast';
    var currency = price.currency || '';

    if (mode === 'fixed' || mode === 'variable') {
      if (price.price == null || price.configured === false) { showPriceNoData(T.notConfiguredPrice); return; }
      showPriceFlat(fmtNum(price.price, 3), currency + '/kWh', mode === 'fixed' ? T.priceModeFixed : T.priceModeVariable);
      return;
    }

    if (mode === 'dual') {
      if (!price.configured) { showPriceNoData(T.notConfiguredPrice); return; }
      var dualSlots = (price.slots || []).map(function (s) { return { start: s.start, end: s.end, value: s.price }; });
      showPriceChart(dualSlots, currency, T.priceModeDual, false);
      return;
    }

    // Tariff zones: the next 24 hours from the configured zones, and the zone in force now.
    // There was no branch for them, so they fell into the forecast one and read
    // "0 slot(s) ahead · never updated" (1.2.299).
    if (mode === 'zones') {
      if (!price.configured || !(price.slots || []).length) { showPriceNoData(T.notConfiguredPrice); return; }
      var zoneSlots = price.slots.map(function (s) { return { start: s.start, end: s.end, value: s.price }; });
      showPriceChart(zoneSlots, currency, T.priceModeZones + (price.zoneName ? ' · ' + price.zoneName : ''), false);
      return;
    }

    // forecast
    if (!price.configured) { showPriceNoData(T.notConfiguredPrice); return; }
    var fcSlots = (price.slots || [])
      .filter(function (s) { return s.end > nowMs; })
      .slice(0, 48)
      .map(function (s) { return { start: s.start, end: s.end, value: s.price }; });
    showPriceChart(fcSlots, currency, statusLine(
      price.nowPrice != null ? fmtNum(Number(price.nowPrice), 3) : null,
      price.slotCount || 0, price.ageMin, price.stale
    ), price.stale);
  }

  // Ready once, with the height of the first drawing. The widget announced 460 px — too
  // tall for a phone, and more than it drew — and then shrank (1.2.300).
  var readied = false;
  function syncHeight() {
    if (!readied) {
      readied = true;
      requestAnimationFrame(function () {
        Homey.ready({ height: Math.ceil(card.getBoundingClientRect().bottom) + 16 });
      });
      return;
    }
    fitHeight(Homey, document.body);
  }

  function render(data) {
    applyLang(data && data.lang); // authoritative language, before anything is drawn
    if (!data || data.error) { showNoData(T.unreachable); syncHeight(); return; }
    content.style.display = 'block';
    noData.style.display  = 'none';
    var nowMs = Date.now();
    renderSolar(data.pv, nowMs);
    renderPrice(data.price, nowMs);
    syncHeight();
  }

  // Forecasts refresh server-side at most every ~1h (price) / ~3h (Solcast), so a fast
  // poll would just re-render identical data — 60s keeps it responsive without waste.
  // While the dashboard is hidden we stop entirely and catch up on return.
  var poll = poller({
    ms: 60000,
    run: function () { return Homey.api('GET', '/forecast'); },
    onOk: render,
    onFail: function (first) { if (first) render({ error: 'unreachable' }); },
  });

  refreshBtn.addEventListener('click', function () {
    haptic();
    refreshBtn.classList.remove('spin');
    void refreshBtn.offsetWidth; // restart animation
    refreshBtn.classList.add('spin');
    poll.now();
  });
}
</script>
</body>
</html>
