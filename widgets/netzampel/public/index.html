<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netzampel</title>
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  /* Sizes, colours and spacing from Homey's widget styling guide (--homey-*). Text is never
     smaller than --homey-font-size-small, and the pulse is a ring, not a shadow — Homey's
     frame carries the only shadow on the dashboard (1.2.300). */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  #content { display: flex; flex-direction: column; gap: var(--homey-su-3); }

  /* Main status row */
  .main {
    display: flex;
    align-items: center;
    gap: var(--homey-su-4);
  }

  /* Status circle, with a ring that widens and fades while a state holds */
  .circle {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--homey-text-color-light);
    color: var(--homey-text-color-light);
  }
  .circle::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 2px solid currentColor;
    opacity: 0;
  }
  @keyframes ring {
    0%   { transform: scale(1);    opacity: 0.6; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .pulse-green  { background: var(--homey-color-green); color: var(--homey-color-green); }
  .pulse-yellow { background: #F59E0B;                  color: #F59E0B; }
  .pulse-red    { background: var(--homey-color-red);   color: var(--homey-color-red); }
  .pulse-green::after, .pulse-yellow::after, .pulse-red::after { animation: ring 2s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { .circle::after { animation: none !important; } }

  .status-wrap {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .status-label,
  .status-sub {
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
  }
  .status-label { font-weight: var(--homey-font-weight-medium); }

  .status-value {
    font-size: var(--homey-font-size-xxlarge);
    line-height: var(--homey-line-height-xxlarge);
    font-weight: var(--homey-font-weight-bold);
    color: var(--homey-text-color);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* Stats row */
  .stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: var(--homey-su-1) var(--homey-su-3);
    padding-top: var(--homey-su-3);
    border-top: var(--homey-line);
  }

  .stat {
    display: flex;
    align-items: center;
    gap: var(--homey-su-1);
  }

  .stat-icon {
    width: var(--homey-icon-size-regular, 16px);
    height: var(--homey-icon-size-regular, 16px);
    flex-shrink: 0;
  }

  .stat-val {
    font-size: var(--homey-font-size-small);
    line-height: var(--homey-line-height-small);
    font-weight: var(--homey-font-weight-medium);
    color: var(--homey-text-color);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* Skeleton */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.7; }
  }
  body.loading .status-value,
  body.loading .stat-val {
    animation: skeleton-pulse 1.4s ease-in-out infinite;
  }
  /* Values the app has not confirmed for two polls are dimmed, not shown as live. */
  body.stale .status-value, body.stale .stat-val { opacity: 0.45; }
</style>
</head>
<body class="homey-widget loading">

<div id="content">
<div class="main">
  <div class="circle" id="circle"></div>
  <div class="status-wrap">
    <div class="status-label" id="status-label">—</div>
    <div class="status-value" id="status-value">—</div>
    <div class="status-sub" id="status-sub"></div>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <svg class="stat-icon" viewBox="0 0 24 24" fill="none" style="stroke:#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
      <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
      <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
    </svg>
    <span class="stat-val" id="pv-stat">—</span>
  </div>
  <div class="stat" id="batt-stat-wrap">
    <svg class="stat-icon" id="batt-stat-icon" viewBox="0 0 24 24" fill="none" style="stroke:var(--homey-text-color-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="16" height="10" rx="2"/>
      <line x1="22" y1="10" x2="22" y2="14"/>
    </svg>
    <span class="stat-val" id="batt-stat">—</span>
  </div>
  <div class="stat">
    <svg class="stat-icon" viewBox="0 0 24 24" fill="none" style="stroke:var(--homey-color-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
    <span class="stat-val" id="house-stat">—</span>
  </div>
</div>
</div>

<script>
// Language comes from the API payload (Homey i18n.getLanguage()), not
// navigator.language — see lib/widget-data.js.
var DICTS = (function() {
  var de = {
    export: 'Einspeisung', exportSub: 'ins Netz',
    import: 'Netzbezug',   importSub: 'vom Netz',
    self:   'Eigenversorgung', selfSub: 'PV deckt Verbrauch',
    selfSubBatt: 'Batterie deckt Verbrauch', selfSubBoth: 'PV + Batterie decken Verbrauch',
    selfSubIdle: 'kein Netzbezug',
    unknown: 'Keine Netzdaten', unknownSub: 'kein Zähler gekoppelt',
    unreachable: 'App antwortet nicht', stale: '⚠ nicht aktuell',
  };
  var nl = {
    export: 'Teruglevering', exportSub: 'aan net',
    import: 'Netafname',     importSub: 'van net',
    self:   'Zelfvoorzienend', selfSub: 'PV dekt verbruik',
    selfSubBatt: 'Batterij dekt verbruik', selfSubBoth: 'PV + batterij dekken verbruik',
    selfSubIdle: 'geen netafname',
    unknown: 'Geen netgegevens', unknownSub: 'geen meter gekoppeld',
    unreachable: 'App reageert niet', stale: '⚠ niet actueel',
  };
  var en = {
    export: 'Feed-in',      exportSub: 'to grid',
    import: 'Grid import',  importSub: 'from grid',
    self:   'Self-sufficient', selfSub: 'PV covers load',
    selfSubBatt: 'Battery covers load', selfSubBoth: 'PV + battery cover load',
    selfSubIdle: 'no grid import',
    unknown: 'No grid data', unknownSub: 'no meter paired',
    unreachable: 'App not responding', stale: '⚠ not current',
  };
  return { de: de, nl: nl, en: en };
})();
function dictFor(code) {
  var l = String(code || '');
  return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
}
var activeLang = null;
var T = dictFor(navigator.language); // placeholder until the first payload arrives
function applyLang(code) {
  if (!code || code === activeLang) return false;
  activeLang = code;
  T = dictFor(code);
  return true;
}

/* ── Shared by this app's widgets (the same block in each — a widget cannot load another
   widget's files). fmtNum writes numbers the way the dashboard language does: 8,8 kW in
   German, 8.8 kW in English (1.2.300). poller asks one request at a time, says so when the
   first answer never comes, dims values after two missed answers instead of showing them
   as live, and rests while the dashboard is hidden. fitHeight follows content whose height
   changes, through Homey.setHeight, and only when it does. ───────────────────────────── */
var _nf = {};
function fmtNum(v, digits) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  var key = (activeLang || '') + '|' + digits;
  if (!_nf[key]) {
    try { _nf[key] = new Intl.NumberFormat(activeLang || undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
    catch (e) { _nf[key] = { format: function (x) { return x.toFixed(digits); } }; }
  }
  return _nf[key].format(v);
}
function poller(opts) {
  var busy = false, timer = null, loaded = false, misses = 0;
  function tick() {
    if (busy) return;
    busy = true;
    Promise.resolve().then(opts.run).then(function (data) {
      busy = false; misses = 0; loaded = true;
      document.body.classList.remove('stale');
      opts.onOk(data);
    }, function (err) {
      busy = false; misses++;
      if (!loaded) opts.onFail(true, err);
      else if (misses >= 2) { document.body.classList.add('stale'); opts.onFail(false, err); }
    });
  }
  function start() { if (!timer) timer = setInterval(tick, opts.ms); }
  function stop()  { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stop(); return; }
    tick(); start();
  });
  tick();
  if (!document.hidden) start();
  return { now: tick };
}
var _fitH = 0;
function fitHeight(Homey, el) {
  requestAnimationFrame(function () {
    var h = Math.ceil(el.getBoundingClientRect().bottom);
    if (h > 0 && h !== _fitH) { _fitH = h; Homey.setHeight(h); }
  });
}
/* ── end of the shared block ── */

function fmt(w) {
  if (w === null || w === undefined) return '—';
  var abs = Math.abs(w);
  if (abs >= 1000) return fmtNum(abs / 1000, 1) + ' kW';
  return fmtNum(Math.round(abs), 0) + ' W';
}

// Who covers the house while the grid is quiet. The self-sufficient state used to name
// PV and show the PV figure whatever was going on — at night, with the battery carrying
// the load, that read "self-sufficient 0 W, PV covers load" (1.2.299).
function selfSubKey(pv, batt, thr) {
  var pvOn   = pv   !== null && pv   !== undefined && pv   > thr;
  var battOn = batt !== null && batt !== undefined && batt < -thr;
  return pvOn && battOn ? 'selfSubBoth' : pvOn ? 'selfSub' : battOn ? 'selfSubBatt' : 'selfSubIdle';
}

function onHomeyReady(Homey) {
  var thr = 50; // activity threshold in W
  try {
    var s = Homey.getSettings();
    if (s && s.power_threshold_w) thr = parseFloat(s.power_threshold_w) || 50;
  } catch(e) {}

  var content = document.getElementById('content');
  var circle = document.getElementById('circle');
  var label  = document.getElementById('status-label');
  var value  = document.getElementById('status-value');
  var sub    = document.getElementById('status-sub');

  // Ready once, with the height of the first drawing: on a narrow dashboard the stats
  // wrap to a second line, and a fixed height cut them off.
  var readied = false;
  function settle() {
    if (!readied) {
      readied = true;
      requestAnimationFrame(function () {
        Homey.ready({ height: Math.ceil(content.getBoundingClientRect().bottom) + 16 });
      });
    }
  }

  function render(data) {
    document.body.classList.remove('loading');

    var grid  = data.gridPower;
    var pv    = data.pvPower;
    var batt  = data.batteryPower;
    var house = data.housePower;

    // Grid status. An unknown reading is its own state, never one of the three verdicts
    // below: with grid === null both comparisons are false and the widget used to fall
    // through to "self-sufficient" -- announcing that the house covers its own load on the
    // strength of no measurement at all.
    if (grid === null || grid === undefined) {
      circle.setAttribute('class', 'circle');
      label.textContent = T.unknown;
      value.textContent = '—';
      value.style.color = 'var(--homey-text-color-light)';
      sub.textContent   = T.unknownSub;
    } else if (grid < -thr) {
      // Exporting to grid
      circle.setAttribute('class', 'circle pulse-green');
      label.textContent = T.export;
      value.textContent = fmt(-grid);
      value.style.color = 'var(--homey-color-green)';
      sub.textContent   = T.exportSub;
    } else if (grid > thr) {
      // Importing from grid
      circle.setAttribute('class', 'circle pulse-red');
      label.textContent = T.import;
      value.textContent = fmt(grid);
      value.style.color = 'var(--homey-color-red)';
      sub.textContent   = T.importSub;
    } else {
      // Self-sufficient: the load being covered, and by what.
      circle.setAttribute('class', 'circle pulse-yellow');
      label.textContent = T.self;
      value.textContent = fmt(house);
      value.style.color = '#F59E0B';
      sub.textContent   = T[selfSubKey(pv, batt, thr)];
    }

    // Stats
    document.getElementById('pv-stat').textContent    = fmt(pv);
    document.getElementById('house-stat').textContent = fmt(house);

    // Battery stat: hide entirely when no battery device
    var battStatEl = document.getElementById('batt-stat-wrap');
    if (batt === null && data.batterySoc === null) {
      battStatEl.style.display = 'none';
    } else {
      battStatEl.style.display = '';
      var socStr = (data.batterySoc !== null && data.batterySoc !== undefined)
        ? fmtNum(Math.round(data.batterySoc), 0) + ' %' : '';
      var battText = fmt(batt);
      document.getElementById('batt-stat').textContent = socStr
        ? battText + ' · ' + socStr : battText;
      var battIcon = document.getElementById('batt-stat-icon');
      battIcon.style.stroke =
        (batt === null || batt === undefined) ? 'var(--homey-text-color-light)'
        : batt > thr  ? 'var(--homey-color-green)'
        : batt < -thr ? '#F97316'
        : 'var(--homey-text-color-light)';
    }
    settle();
  }

  // Every 15 s: the readings behind it change once a minute at most on a default Modbus
  // poll, and every five or ten minutes from the cloud (1.2.300; it asked every 5 s).
  poller({
    ms: 15000,
    run: function () { return Homey.api('GET', '/', {}); },
    onOk: function (data) { applyLang(data && data.lang); if (data) render(data); },
    onFail: function (first) {
      document.body.classList.remove('loading');
      if (first) {
        label.textContent = T.unreachable;
        value.textContent = '—';
        sub.textContent = '';
        settle();
      } else {
        sub.textContent = T.stale;
      }
    },
  });
}
</script>
</body>
</html>
