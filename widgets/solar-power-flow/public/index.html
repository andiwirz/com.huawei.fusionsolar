<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Power Flow</title>
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 13px 12px;
  }

  .flow-wrap {
    position: relative;
    width: 100%;
    height: 174px;
  }

  /* ── Nodes ── */
  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transform: translate(-50%, -50%);
    z-index: 2;
    transition: opacity 0.4s;
  }

  .node-icon { width: 22px; height: 22px; }

  .node-value {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--homey-text-color);
    white-space: nowrap;
    line-height: 1;
  }

  .node-label {
    font-size: 9px;
    color: var(--homey-text-color-light);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }

  .node-sub {
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    min-height: 13px;
    color: var(--homey-text-color-light);
  }

  /* ── Hub circle ── */
  .hub {
    position: absolute;
    left: 50%; top: 50%;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--homey-line-color);
    border: 2.5px solid transparent;
    transform: translate(-50%, -50%);
    z-index: 3;
    transition: border-color 0.5s ease, box-shadow 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hub-icon {
    width: 14px;
    height: 14px;
    opacity: 0.5;
    transition: opacity 0.4s ease, stroke 0.4s ease;
    flex-shrink: 0;
  }

  /* ── SVG connection lines ── */
  .connections {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    z-index: 1;
    pointer-events: none;
  }

  /* ── Flow animations ──
     flow-fwd: dashes march from line-start toward line-end
     flow-rev: dashes march from line-end toward line-start  */
  @keyframes flow-fwd { to { stroke-dashoffset: -18; } }
  @keyframes flow-rev { to { stroke-dashoffset:  18; } }

  /* ── Skeleton ── */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.7; }
  }
  body.loading .node-value {
    animation: skeleton-pulse 1.4s ease-in-out infinite;
  }
</style>
</head>
<body class="loading">

<div class="flow-wrap" id="flow-wrap">

  <!-- SVG — coordinates filled by JS after layout -->
  <svg class="connections" id="svg-conn">
    <line id="line-pv"    stroke-width="2" stroke-dasharray="5 4"/>
    <line id="line-house" stroke-width="2" stroke-dasharray="5 4"/>
    <line id="line-grid"  stroke-width="2" stroke-dasharray="5 4"/>
    <line id="line-batt"  stroke-width="2" stroke-dasharray="5 4"/>
  </svg>

  <!-- Hub -->
  <div class="hub" id="hub">
    <svg class="hub-icon" id="hub-icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
    </svg>
  </div>

  <!-- PV (top center) -->
  <div class="node" id="node-pv" style="left:50%;top:16%">
    <svg class="node-icon" viewBox="0 0 24 24" fill="none"
         stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2"  x2="12" y2="5"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="4.22"  y1="4.22"  x2="6.34"  y2="6.34"/>
      <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
      <line x1="2"  y1="12" x2="5"  y2="12"/>
      <line x1="19" y1="12" x2="22" y2="12"/>
      <line x1="4.22"  y1="19.78" x2="6.34"  y2="17.66"/>
      <line x1="17.66" y1="6.34"  x2="19.78" y2="4.22"/>
    </svg>
    <div class="node-value" id="pv-val">—</div>
    <div class="node-label" id="label-pv"></div>
  </div>

  <!-- Grid (middle left) -->
  <div class="node" id="node-grid" style="left:12%;top:50%">
    <svg class="node-icon" id="grid-icon" viewBox="0 0 24 24" fill="none"
         stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
    </svg>
    <div class="node-value" id="grid-val">—</div>
    <div class="node-label" id="label-grid"></div>
    <div class="node-sub"  id="grid-sub"></div>
  </div>

  <!-- Battery (middle right) -->
  <div class="node" id="node-batt" style="left:88%;top:50%">
    <svg class="node-icon" id="batt-icon" viewBox="0 0 24 24" fill="none"
         stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="16" height="10" rx="2"/>
      <line x1="22" y1="10" x2="22" y2="14"/>
      <line x1="6"  y1="12" x2="12" y2="12"/>
      <line x1="9"  y1="9"  x2="9"  y2="15"/>
    </svg>
    <div class="node-value" id="batt-val">—</div>
    <div class="node-label" id="label-batt"></div>
    <div class="node-sub"  id="batt-soc"></div>
  </div>

  <!-- House (bottom center) -->
  <div class="node" id="node-house" style="left:50%;top:84%">
    <svg class="node-icon" viewBox="0 0 24 24" fill="none"
         stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
    <div class="node-value" id="house-val">—</div>
    <div class="node-label" id="label-house"></div>
  </div>

</div>

<script>
// Language comes from the API payload (Homey i18n.getLanguage()), not
// navigator.language — see widgets/ems-device/api.js.
var DICTS = (function() {
  var de = { pv: 'Solar', grid: 'Netz', batt: 'Batterie', house: 'Haus',  export: 'Einspeisung', import: 'Bezug'  };
  var nl = { pv: 'Zon',   grid: 'Net',  batt: 'Batterij', house: 'Huis',  export: 'Teruglevering', import: 'Afname' };
  var en = { pv: 'Solar', grid: 'Grid', batt: 'Battery',  house: 'House', export: 'Export',       import: 'Import' };
  return { de: de, nl: nl, en: en };
})();
function dictFor(code) {
  var l = String(code || '');
  return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
}
var activeLang = null;
var T = dictFor(navigator.language); // placeholder until the first payload arrives
// Top level, like applyLang which calls it. It used to sit inside onHomeyReady, out of
// applyLang's reach: the first payload threw a ReferenceError, the widget kept its loading
// state until the next poll, and the labels stayed in the phone's language (1.2.299).
function applyStaticLabels() {
  document.getElementById('label-pv').textContent    = T.pv;
  document.getElementById('label-grid').textContent  = T.grid;
  document.getElementById('label-batt').textContent  = T.batt;
  document.getElementById('label-house').textContent = T.house;
}
function applyLang(code) {
  if (!code || code === activeLang) return false;
  activeLang = code;
  T = dictFor(code);
  applyStaticLabels();
  return true;
}

var C = {
  pv:        '#F59E0B',
  house:     '#3B82F6',
  charge:    '#22C55E',
  discharge: '#F97316',
  export:    '#22C55E',
  import:    '#EF4444',
  idle:      'var(--homey-line-color)',
};

function fmt(w) {
  if (w === null || w === undefined) return '—';
  var abs = Math.abs(w);
  if (abs >= 1000) return (abs / 1000).toFixed(1) + ' kW';
  return Math.round(abs) + ' W';
}

/* ── Line coordinate calculation ── */
function rel(el, wrap) {
  var r = el.getBoundingClientRect();
  var w = wrap.getBoundingClientRect();
  return {
    top:    r.top    - w.top,
    bottom: r.bottom - w.top,
    left:   r.left   - w.left,
    right:  r.right  - w.left,
    cx:     (r.left + r.right)  / 2 - w.left,
    cy:     (r.top  + r.bottom) / 2 - w.top,
  };
}

function setCoords(id, x1, y1, x2, y2) {
  var el = document.getElementById(id);
  if (!el) return;
  el.setAttribute('x1', Math.round(x1));
  el.setAttribute('y1', Math.round(y1));
  el.setAttribute('x2', Math.round(x2));
  el.setAttribute('y2', Math.round(y2));
}

function positionLines() {
  var wrap  = document.getElementById('flow-wrap');
  var hub   = rel(document.getElementById('hub'),       wrap);
  var pv    = rel(document.getElementById('node-pv'),   wrap);
  var house = rel(document.getElementById('node-house'),wrap);
  var grid  = rel(document.getElementById('node-grid'), wrap);
  var batt  = rel(document.getElementById('node-batt'), wrap);

  // PV, Hub and House are all at left:50% — use the wrapper's exact midpoint
  // so both vertical lines share one pixel-perfect x-coordinate regardless of
  // how wide the live value text happens to be in each node.
  var midX = Math.round(wrap.getBoundingClientRect().width / 2);

  // PV bottom-center → hub top-center  (perfectly vertical)
  setCoords('line-pv',    midX,       pv.bottom,  midX,      hub.top);
  // hub bottom-center → house top-center  (perfectly vertical)
  setCoords('line-house', midX,       hub.bottom, midX,      house.top);
  // grid right-center → hub left-center
  setCoords('line-grid',  grid.right, grid.cy,    hub.left,  hub.cy);
  // hub right-center → batt left-center
  setCoords('line-batt',  hub.right,  hub.cy,     batt.left, batt.cy);
}

/* ── Animate a line ── */
function setLine(id, anim, color) {
  var el = document.getElementById(id);
  if (!el) return;
  el.style.stroke          = color;
  el.style.strokeOpacity   = anim ? '1' : '0.35';
  el.style.strokeDasharray = anim ? '5 4' : '3 7';
  el.style.animation       = anim ? (anim + ' 0.5s linear infinite') : 'none';
}

function onHomeyReady(Homey) {
  Homey.ready({ height: 200 });
  document.body.classList.add('loading');

  var thr = 50; // activity threshold in W
  try {
    var s = Homey.getSettings();
    if (s && s.power_threshold_w) thr = parseFloat(s.power_threshold_w) || 50;
  } catch(e) {}

  function render(data) {
    document.body.classList.remove('loading');

    var pv    = data.pvPower;
    var batt  = data.batteryPower;
    var grid  = data.gridPower;
    var soc   = data.batterySoc;
    var house = data.housePower;

    // ── Values ──
    document.getElementById('pv-val').textContent    = fmt(pv);
    document.getElementById('house-val').textContent = fmt(house);
    document.getElementById('batt-val').textContent  = fmt(batt);
    document.getElementById('grid-val').textContent  = fmt(grid !== null ? Math.abs(grid) : null);

    document.getElementById('batt-soc').textContent =
      (soc !== null && soc !== undefined) ? Math.round(soc) + '%' : '';

    // The same threshold as the line beside it — a fixed 50 W here said "Import" next
    // to an idle line whenever the setting was higher.
    document.getElementById('grid-sub').textContent =
      (grid !== null && grid < -thr) ? T.export :
      (grid !== null && grid >  thr) ? T.import : '';

    // ── Recalculate line positions (text may have changed width) ──
    positionLines();

    // ── PV line: PV→Hub top-down, fwd = producing ──
    setLine('line-pv',
      (pv !== null && pv > thr) ? 'flow-fwd' : null,
      (pv !== null && pv > thr) ? C.pv : C.idle);

    // ── House line: Hub→House top-down, fwd = consuming ──
    setLine('line-house',
      (house !== null && house > thr) ? 'flow-fwd' : null,
      (house !== null && house > thr) ? C.house : C.idle);

    // ── Battery line: Hub(left)→Battery(right)
    //    fwd = charging (hub→batt) | rev = discharging (batt→hub) ──
    var battNode = document.getElementById('node-batt');
    if (batt === null || batt === undefined) {
      setLine('line-batt', null, 'transparent');
      battNode.style.opacity = '0.25';
      document.getElementById('batt-icon').setAttribute('stroke', '#9CA3AF');
    } else {
      battNode.style.opacity = '1';
      if (batt > thr) {
        setLine('line-batt', 'flow-fwd', C.charge);
        document.getElementById('batt-icon').setAttribute('stroke', C.charge);
      } else if (batt < -thr) {
        setLine('line-batt', 'flow-rev', C.discharge);
        document.getElementById('batt-icon').setAttribute('stroke', C.discharge);
      } else {
        setLine('line-batt', null, C.idle);
        document.getElementById('batt-icon').setAttribute('stroke', '#9CA3AF');
      }
    }

    // ── Grid line: Grid(left)→Hub(right)
    //    fwd = import (grid→hub) | rev = export (hub→grid) ──
    if (grid !== null && grid < -thr) {
      setLine('line-grid', 'flow-rev', C.export);
      document.getElementById('grid-icon').setAttribute('stroke', C.export);
    } else if (grid !== null && grid > thr) {
      setLine('line-grid', 'flow-fwd', C.import);
      document.getElementById('grid-icon').setAttribute('stroke', C.import);
    } else {
      setLine('line-grid', null, C.idle);
      document.getElementById('grid-icon').setAttribute('stroke', '#9CA3AF');
    }

    // ── Hub border ──
    // 🟢 Green:  PV producing AND no grid import
    // 🟠 Orange: no PV, but battery discharging covers load (no import)
    // 🔴 Red:    grid import active (battery empty or absent)
    // ⬜ None:   night / standby
    var hub     = document.getElementById('hub');
    var hubIcon = document.getElementById('hub-icon');
    var importing = grid !== null && grid > thr;
    var pvOn      = pv   !== null && pv   > thr;
    var battDisch = batt !== null && batt < -thr;

    if (pvOn && !importing) {
      hub.style.borderColor     = C.charge;
      hub.style.boxShadow       = '0 0 6px rgba(34,197,94,0.4)';
      hubIcon.style.stroke      = C.charge;
      hubIcon.style.opacity     = '0.8';
    } else if (!pvOn && battDisch && !importing) {
      hub.style.borderColor     = C.pv;
      hub.style.boxShadow       = '0 0 6px rgba(245,158,11,0.4)';
      hubIcon.style.stroke      = C.pv;
      hubIcon.style.opacity     = '0.8';
    } else if (importing) {
      hub.style.borderColor     = C.import;
      hub.style.boxShadow       = '0 0 6px rgba(239,68,68,0.4)';
      hubIcon.style.stroke      = C.import;
      hubIcon.style.opacity     = '0.8';
    } else {
      hub.style.borderColor     = 'transparent';
      hub.style.boxShadow       = 'none';
      hubIcon.style.stroke      = 'currentColor';
      hubIcon.style.opacity     = '0.35';
    }
  }

  function load() {
    Homey.api('GET', '/', {})
      .then(function(data) { applyLang(data && data.lang); if (data) render(data); })
      .catch(function(err) { console.error('widget error:', err); });
  }

  // Translated node labels; re-applied by applyLang on a language change so they never
  // stay in the language the widget first rendered in.
  applyStaticLabels();

  // Initial line positioning once DOM is painted
  requestAnimationFrame(function() {
    requestAnimationFrame(positionLines);
  });

  load();
  // Polling stops entirely while the dashboard is hidden — it used to keep running
  // around the clock — and catches up immediately on return.
  var POLL_MS = 5000;
  var pollTimer = null;
  function startPolling() { if (!pollTimer) pollTimer = setInterval(load, POLL_MS); }
  function stopPolling()  { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  if (!document.hidden) startPolling();
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) { stopPolling(); return; }
    load();
    startPolling();
  });
}
</script>
</body>
</html>
