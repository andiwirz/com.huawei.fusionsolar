<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  /* Colors come from Homey's own --homey-* variables (widget styling guide),
     which follow the dashboard's light/dark setting — NOT the OS-level
     prefers-color-scheme, which widgets don't reliably get. The purple/orange
     "active session" accent has no direct --homey- equivalent, so its dark-mode
     shade is gated on Homey's own .homey-dark-mode class instead of a media
     query — that class reflects the dashboard's actual theme choice. */
  /* Sizes and spacing from Homey's widget styling guide too: no text below
     --homey-font-size-small, no second card inside Homey's own frame, no shadows, and
     the list grows with its rows instead of scrolling in a fixed box (1.2.300). */
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--homey-text-color); }
  .session-row { padding: var(--homey-su-2) 0; border-bottom: var(--homey-line-light); }
  .session-row:last-child { border-bottom: none; }
  .top-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 var(--homey-su-2); }
  .date-range {
    font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
    font-weight: var(--homey-font-weight-medium);
  }
  .date-range .arrow { color: var(--homey-text-color-light); font-weight: var(--homey-font-weight-regular); margin: 0 3px; }
  .phase-tag, .duration-energy, .reason {
    font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
  }
  .phase-tag { white-space: nowrap; }
  .bottom-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 var(--homey-su-2); }
  .duration-energy b { color: var(--homey-text-color); font-weight: var(--homey-font-weight-bold); font-variant-numeric: tabular-nums; }
  .active {
    background: rgba(109, 74, 255, 0.1);
    border-radius: var(--homey-border-radius-small);
    padding: var(--homey-su-2) var(--homey-su-3);
    margin-bottom: var(--homey-su-1);
    border-bottom: none;
  }
  .active .date-range { color: #6d4aff; }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #6d4aff; margin-right: var(--homey-su-1);
  }
  .active.paused { background: rgba(255, 149, 0, 0.1); }
  .active.paused .date-range { color: #e08600; }
  .active.paused .live-dot { background: #ff9500; }
  .empty {
    font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light); padding: var(--homey-su-3) 0; text-align: center;
  }
  body.stale .duration-energy b { opacity: 0.45; }

  /* Homey's own dark-mode marker (see comment above) — lighten the two accent
     colors for contrast against a dark card, exactly as before. */
  .homey-dark-mode .active .date-range { color: #9678ff; }
  .homey-dark-mode .active.paused .date-range { color: #ffb04d; }
</style>
</head>
<body class="homey-widget">
  <div class="card" id="card">
    <div class="empty" id="empty"></div>
    <div id="list"></div>
    <div class="empty" id="status" style="display:none"></div>
  </div>

<script type="text/javascript">
function onHomeyReady(Homey) {
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');

  const settings = Homey.getSettings();
  const maxRows = parseInt(settings.rows || '5', 10);

  // Language comes from the API payload (Homey i18n.getLanguage()), not
  // navigator.language — see widgets/ems-device/api.js.
  const DICTS = (function () {
    const de = {
      loading: 'Lädt…', notAvailable: 'Nicht verfügbar', unreachable: 'Lader nicht erreichbar',
      paused: 'Pausiert', inProgress: 'Läuft', startedAt: 'gestartet ', soFar: 'bisher', noSessions: 'Noch keine Sitzungen',
      noCharger: 'Kein Lader gekoppelt', stale: '⚠ nicht aktuell',
      reasons: { EVDisconnected: 'Auto getrennt', Remote: 'Fern gestoppt', Local: 'Am Lader gestoppt',
        PowerLoss: 'Stromausfall', EmergencyStop: 'Not-Aus', DeAuthorized: 'Nicht berechtigt',
        HardReset: 'Neustart', SoftReset: 'Neustart', Reboot: 'Neustart', UnlockCommand: 'Entriegelt',
        EnergyLimitReached: 'Energielimit erreicht', SOCLimitReached: 'Ladeziel erreicht',
        TimeLimitReached: 'Zeitlimit erreicht', Other: 'Anderer Grund' },
    };
    const nl = {
      loading: 'Laden…', notAvailable: 'Niet beschikbaar', unreachable: 'Lader niet bereikbaar',
      paused: 'Gepauzeerd', inProgress: 'Bezig', startedAt: 'gestart ', soFar: 'tot nu toe', noSessions: 'Nog geen sessies',
      noCharger: 'Geen lader gekoppeld', stale: '⚠ niet actueel',
      reasons: { EVDisconnected: 'Auto losgekoppeld', Remote: 'Op afstand gestopt', Local: 'Aan de lader gestopt',
        PowerLoss: 'Stroomuitval', EmergencyStop: 'Noodstop', DeAuthorized: 'Niet geautoriseerd',
        HardReset: 'Herstart', SoftReset: 'Herstart', Reboot: 'Herstart', UnlockCommand: 'Ontgrendeld',
        EnergyLimitReached: 'Energielimiet bereikt', SOCLimitReached: 'Laaddoel bereikt',
        TimeLimitReached: 'Tijdslimiet bereikt', Other: 'Andere reden' },
    };
    const en = {
      loading: 'Loading…', notAvailable: 'Not available', unreachable: 'Charger unreachable',
      paused: 'Paused', inProgress: 'In progress', startedAt: 'started ', soFar: 'so far', noSessions: 'No sessions yet',
      noCharger: 'No charger paired', stale: '⚠ not current',
      reasons: { EVDisconnected: 'Car disconnected', Remote: 'Stopped remotely', Local: 'Stopped at the charger',
        PowerLoss: 'Power loss', EmergencyStop: 'Emergency stop', DeAuthorized: 'Not authorised',
        HardReset: 'Restart', SoftReset: 'Restart', Reboot: 'Restart', UnlockCommand: 'Unlocked',
        EnergyLimitReached: 'Energy limit reached', SOCLimitReached: 'Charge target reached',
        TimeLimitReached: 'Time limit reached', Other: 'Other reason' },
    };
    return { de, nl, en };
  })();
  function dictFor(code) {
    const l = String(code || '');
    return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
  }
  var activeLang = null;
  let T = dictFor(navigator.language); // placeholder until the first payload arrives
  function applyLang(code) {
    if (!code || code === activeLang) return false;
    activeLang = code;
    T = dictFor(code);
    return true;
  }
  emptyEl.textContent = T.loading;

  /* ── Shared by this app's widgets (the same block in each — a widget cannot load another
     widget's files). fmtNum writes numbers the way the dashboard language does: 8,8 kW in
     German, 8.8 kW in English (1.2.300). poller asks one request at a time, says so when the
     first answer never comes, dims values after two missed answers instead of showing them
     as live, and rests while the dashboard is hidden. fitHeight follows content whose height
     changes, through Homey.setHeight, and only when it does. ───────────────────────────── */
  var _nf = {};
  function fmtNum(v, digits) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    var key = (activeLang || '') + '|' + digits;
    if (!_nf[key]) {
      try { _nf[key] = new Intl.NumberFormat(activeLang || undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
      catch (e) { _nf[key] = { format: function (x) { return x.toFixed(digits); } }; }
    }
    return _nf[key].format(v);
  }
  function poller(opts) {
    var busy = false, timer = null, loaded = false, misses = 0;
    function tick() {
      if (busy) return;
      busy = true;
      Promise.resolve().then(opts.run).then(function (data) {
        busy = false; misses = 0; loaded = true;
        document.body.classList.remove('stale');
        opts.onOk(data);
      }, function (err) {
        busy = false; misses++;
        if (!loaded) opts.onFail(true, err);
        else if (misses >= 2) { document.body.classList.add('stale'); opts.onFail(false, err); }
      });
    }
    function start() { if (!timer) timer = setInterval(tick, opts.ms); }
    function stop()  { if (timer) { clearInterval(timer); timer = null; } }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { stop(); return; }
      tick(); start();
    });
    tick();
    if (!document.hidden) start();
    return { now: tick };
  }
  var _fitH = 0;
  function fitHeight(Homey, el) {
    requestAnimationFrame(function () {
      var h = Math.ceil(el.getBoundingClientRect().bottom);
      if (h > 0 && h !== _fitH) { _fitH = h; Homey.setHeight(h); }
    });
  }
  /* ── end of the shared block ── */

  // The date as the dashboard language writes it — "9. Okt." in German, "Oct 9" in English;
  // a month list with the day after it read "Okt 9" in every language (1.2.300).
  function fmtDate(ts) {
    try { return new Date(ts).toLocaleDateString(activeLang || undefined, { day: 'numeric', month: 'short' }); }
    catch (e) { const d = new Date(ts); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; }
  }
  function fmtTime(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function sameDay(a, b) {
    const da = new Date(a), db = new Date(b);
    return da.getFullYear() === db.getFullYear() && da.getMonth() === db.getMonth() && da.getDate() === db.getDate();
  }
  function fmtDuration(ms) {
    const mins = Math.floor(ms / 60000);
    if (mins < 60) return mins + 'm';
    const h = Math.floor(mins / 60);
    return h + 'h ' + (mins % 60) + 'm';
  }
  function fmtEnergy(wh) {
    if (wh == null) return '—';
    if (wh >= 1000) return fmtNum(wh / 1000, 2) + ' kWh';
    return fmtNum(Math.round(wh), 0) + ' Wh';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function phaseTag(amps, phases) {
    if (!amps) return '';
    // "4.1 kW (6A) / 3P" — kW truncated to one decimal like everywhere
    // else; rows recorded before phases were tracked fall back to amps-only
    const p = phases
      ? fmtNum(Math.floor(amps * phases * 230 / 100) / 10, 1) + ' kW (' + amps + ' A) / ' + phases + 'P'
      : amps + ' A';
    return '<div class="phase-tag">' + esc(p) + '</div>';
  }

  // The charger's stop reason in words; the EMS's own rows carry car and PV share instead,
  // which pass through as they are.
  function reasonText(r) {
    return (r && T.reasons[r]) || r || '';
  }

  // Every session in progress — two chargers can run at once (1.2.300). An older app that
  // sends only `current` still works.
  function runningOf(data) {
    const list = Array.isArray(data.currents) ? data.currents : (data.current ? [data.current] : []);
    return list.filter((c) => c && c.startTime);
  }

  let liveStarts = [];

  function render(data) {
    if (!data || data.error) {
      emptyEl.style.display = 'block';
      emptyEl.textContent = !data ? T.notAvailable : data.error === 'no_charger' ? T.noCharger : (data.error || T.notAvailable);
      listEl.innerHTML = '';
      return;
    }
    const rows = [];
    const running = runningOf(data);
    liveStarts = running.map((c) => c.startTime);

    running.forEach((cur, i) => {
      const isPaused = cur.paused === true;
      rows.push(
        '<div class="session-row active' + (isPaused ? ' paused' : '') + '">' +
          '<div class="top-line">' +
            '<div class="date-range"><span class="live-dot"></span>' + (isPaused ? T.paused : T.inProgress) + ' \u00b7 ' + T.startedAt +
              esc(fmtDate(cur.startTime)) + ', ' + esc(fmtTime(cur.startTime)) + '</div>' +
          '</div>' +
          '<div class="bottom-line">' +
            '<div class="duration-energy"><b data-live="' + i + '">' + esc(fmtDuration(cur.durationMs)) + '</b> ' + T.soFar + ' \u00b7 <b>' +
              esc(fmtEnergy(cur.energyWh)) + '</b></div>' +
            phaseTag(cur.amps, cur.phases) +
            (cur.reason ? '<div class="reason">' + esc(reasonText(cur.reason)) + '</div>' : '') +
          '</div>' +
        '</div>'
      );
    });

    // Row budget: the sessions in progress come first, completed ones fill the rest.
    const completed = (data.history || []).slice(0, Math.max(0, maxRows - running.length));
    for (const s of completed) {
      const startStr = fmtDate(s.startTime) + ', ' + fmtTime(s.startTime);
      const stopStr = sameDay(s.startTime, s.stopTime)
        ? fmtTime(s.stopTime)
        : fmtDate(s.stopTime) + ', ' + fmtTime(s.stopTime);
      rows.push(
        '<div class="session-row">' +
          '<div class="top-line">' +
            '<div class="date-range">' + esc(startStr) + ' <span class="arrow">\u2192</span> ' + esc(stopStr) + '</div>' +
            phaseTag(s.amps, s.phases) +
          '</div>' +
          '<div class="bottom-line">' +
            '<div class="duration-energy"><b>' + esc(fmtDuration(s.durationMs)) + '</b> \u00b7 <b>' + esc(fmtEnergy(s.energyWh)) + '</b></div>' +
            '<div class="reason">' + esc(reasonText(s.reason)) + '</div>' +
          '</div>' +
        '</div>'
      );
    }

    if (rows.length === 0) {
      emptyEl.style.display = 'block';
      emptyEl.textContent = T.noSessions;
      listEl.innerHTML = '';
    } else {
      emptyEl.style.display = 'none';
      listEl.innerHTML = rows.join('');
    }
  }

  function tickLive() {
    liveStarts.forEach((t, i) => {
      const el = document.querySelector('[data-live="' + i + '"]');
      if (el && t) el.textContent = fmtDuration(Date.now() - t);
    });
  }

  // The height follows the list. It used to be measured once, on the first drawing — and
  // when that drawing was "No sessions yet", an error or the loading line, the widget kept
  // that height and the rows that came later were cut off in a scroll box (1.2.300).
  const card = document.getElementById('card');
  let readyCalled = false;
  function settle() {
    if (!readyCalled) {
      readyCalled = true;
      requestAnimationFrame(() => Homey.ready({ height: Math.ceil(card.getBoundingClientRect().bottom) + 16 }));
    } else {
      fitHeight(Homey, document.body);
    }
  }

  // Every 30 s: a session list changes when a session starts or ends (1.2.300; it asked
  // every 10 s). The 1 s tick only advances the running clocks on screen.
  const statusEl = document.getElementById('status');
  poller({
    ms: 30000,
    run: () => Homey.api('GET', '/sessions'),
    onOk: (data) => {
      applyLang(data && data.lang);
      statusEl.style.display = 'none';
      render(data);
      settle();
    },
    onFail: (first) => {
      if (first) render({ error: T.unreachable });
      else { statusEl.textContent = T.stale; statusEl.style.display = 'block'; }
      settle();
    },
  });
  let tickTimerId = null;
  function startTick() { if (!tickTimerId) tickTimerId = setInterval(tickLive, 1000); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearInterval(tickTimerId); tickTimerId = null; return; }
    startTick();
  });
  if (!document.hidden) startTick();

  // Safety net: never leave the widget stuck in its loading state
  setTimeout(settle, 3000);
}
</script>
</body>
</html>
