<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  /* Colors come from Homey's own --homey-* variables (widget styling guide),
     which follow the dashboard's light/dark setting — NOT the OS-level
     prefers-color-scheme, which widgets don't reliably get. Sizes and spacing come
     from the guide too: no text below --homey-font-size-small, and no second card
     inside Homey's own frame (1.2.300). */
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--homey-text-color); }
  .card { display: flex; flex-direction: column; }
  .photo-wrap {
    position: relative;
    width: 100%;
    /* Full portrait photo, no cropping: height locked to the photo's
       aspect ratio (1056/992) via padding-top, robust in any webview */
    padding-top: 106.45%;
    border-radius: var(--homey-border-radius-default);
    overflow: hidden;
    background: #2a2a2e; /* behind the photo while it loads — the photos are dark */
  }
  .photo-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #imgBlue { opacity: 0; }
  /* Charging: smooth white <-> blue ring crossfade */
  .charging #imgBlue, .finishing #imgBlue { animation: ringPulse 3s ease-in-out infinite; }
  @keyframes ringPulse {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }
  /* Idle: slightly muted photo */
  .muted img { filter: grayscale(35%) brightness(0.95); }

  .status-label {
    font-size: var(--homey-font-size-default); line-height: var(--homey-line-height-default);
    font-weight: var(--homey-font-weight-bold); margin-top: var(--homey-su-3);
  }
  .status-label.error { color: var(--homey-text-color-danger, var(--homey-color-red)); }
  .sub {
    font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
    color: var(--homey-text-color-light);
    /* Always occupy one line, even when empty — states differ in whether
       they have a sub-line (Charging doesn't, Paused/Smart do), and the
       widget height is measured once, so a variable text block leaves a
       trail in some states and would clip in others */
    min-height: var(--homey-line-height-small);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stats {
    display: flex; justify-content: space-between; gap: var(--homey-su-2);
    margin-top: var(--homey-su-3); padding-top: var(--homey-su-3); border-top: var(--homey-line);
  }
  .stat-value {
    font-size: var(--homey-font-size-default); line-height: var(--homey-line-height-default);
    font-weight: var(--homey-font-weight-bold); color: var(--homey-text-color-blue, var(--homey-color-blue));
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .stat-label { font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small); color: var(--homey-text-color-light); }
  /* Values the app has not confirmed for two polls are dimmed, not shown as live. */
  body.stale .stat-value, body.stale .status-label { opacity: 0.45; }
  @media (prefers-reduced-motion: reduce) { .charging #imgBlue, .finishing #imgBlue { animation: none; opacity: 0.6; } }
</style>
</head>
<body class="homey-widget-small">
  <div class="card" id="card">
    <div class="photo-wrap" id="photoWrap">
      <img id="imgBase" src="img/idle.jpg" alt="">
      <img id="imgBlue" src="img/charging_blue.jpg" alt="">
    </div>
    <div class="status-label" id="statusLabel">—</div>
    <div class="sub" id="statusSub"></div>
    <div class="stats">
      <div>
        <div class="stat-value" id="statPower">—</div>
        <div class="stat-label" id="labelPower">Power</div>
      </div>
      <div>
        <div class="stat-value" id="statAmps">—</div>
        <div class="stat-label" id="labelAmps">Amps</div>
      </div>
      <div>
        <div class="stat-value" id="statTimer">—</div>
        <div class="stat-label" id="labelSession">Session</div>
      </div>
    </div>
  </div>

<script type="text/javascript">
function onHomeyReady(Homey) {
  const card = document.getElementById('card');
  const photoWrap = document.getElementById('photoWrap');
  const imgBase = document.getElementById('imgBase');
  const imgBlue = document.getElementById('imgBlue');
  const statusLabel = document.getElementById('statusLabel');
  const statusSub = document.getElementById('statusSub');
  const statPower = document.getElementById('statPower');
  const statAmps = document.getElementById('statAmps');
  const statTimer = document.getElementById('statTimer');

  // Language comes from the API payload (Homey i18n.getLanguage()), not
  // navigator.language — see widgets/ems-device/api.js.
  const DICTS = (function () {
    const de = {
      power: 'Leistung', amps: 'Ampere', session: 'Sitzung',
      notAvailable: 'Nicht verfügbar', unreachable: 'Lader nicht erreichbar', noCharger: 'Kein Lader gekoppelt', stale: '⚠ nicht aktuell',
      phases: { 1: '1-phasig', 2: '2-phasig', 3: '3-phasig' },
      charging: 'Lädt', paused: 'Pausiert', resumesAt: 'Setzt fort bei ',
      states: {
        not_connected: ['Leerlauf', 'Kein Auto verbunden'],
        connected: ['Verbunden', 'Bereit zum Start'],
        smart_charging: ['Smart Charging', 'Wartet auf einen Flow-Start'],
        charging: ['Lädt', ''],
        paused: ['Pausiert', 'Gleiche Sitzung — setzt bei letztem Limit fort'],
        fully_charged: ['Vollständig geladen', 'Kabel noch angeschlossen'],
        finishing: ['Abschluss', 'Auto lädt fast voll'],
        offline: ['Lader offline', 'Nicht mit Homey verbunden'],
        error: ['Fehler', 'Lader prüfen'],
      },
    };
    const nl = {
      power: 'Vermogen', amps: 'Ampère', session: 'Sessie',
      notAvailable: 'Niet beschikbaar', unreachable: 'Lader niet bereikbaar', noCharger: 'Geen lader gekoppeld', stale: '⚠ niet actueel',
      phases: { 1: '1-fase', 2: '2-fasen', 3: '3-fasen' },
      charging: 'Laadt', paused: 'Gepauzeerd', resumesAt: 'Hervat bij ',
      states: {
        not_connected: ['Inactief', 'Geen auto verbonden'],
        connected: ['Verbonden', 'Klaar om te starten'],
        smart_charging: ['Smart Charging', 'Wacht op een flow-start'],
        charging: ['Laadt', ''],
        paused: ['Gepauzeerd', 'Zelfde sessie — hervat bij laatste limiet'],
        fully_charged: ['Volledig opgeladen', 'Kabel nog aangesloten'],
        finishing: ['Afronden', 'Auto bijna vol'],
        offline: ['Lader offline', 'Niet verbonden met Homey'],
        error: ['Fout', 'Controleer de lader'],
      },
    };
    const en = {
      power: 'Power', amps: 'Amps', session: 'Session',
      notAvailable: 'Not available', unreachable: 'Charger unreachable', noCharger: 'No charger paired', stale: '⚠ not current',
      phases: { 1: '1-phase', 2: '2-phase', 3: '3-phase' },
      charging: 'Charging', paused: 'Paused', resumesAt: 'Resumes at ',
      states: {
        not_connected: ['Idle', 'No car connected'],
        connected: ['Connected', 'Ready to start'],
        smart_charging: ['Smart Charging', 'Waiting for a flow to start'],
        charging: ['Charging', ''],
        paused: ['Paused', 'Same session — resumes at your last limit'],
        fully_charged: ['Fully Charged', 'Cable still connected'],
        finishing: ['Finishing', 'Car topping off — almost full'],
        offline: ['Charger Offline', 'Not connected to Homey'],
        error: ['Error', 'Check the charger'],
      },
    };
    return { de, nl, en };
  })();
  function dictFor(code) {
    const l = String(code || '');
    return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
  }
  var activeLang = null;
  let T = dictFor(navigator.language); // placeholder until the first payload arrives
  function applyLang(code) {
    if (!code || code === activeLang) return false;
    activeLang = code;
    T = dictFor(code);
    applyStaticLabels();
    return true;
  }

  // Re-applied on a language change so these never stay in the language the widget
  // first rendered in (which would leave a mixed-language UI).
  function applyStaticLabels() {
    document.getElementById('labelPower').textContent   = T.power;
    document.getElementById('labelAmps').textContent    = T.amps;
    document.getElementById('labelSession').textContent = T.session;
  }
  applyStaticLabels();

  /* ── Shared by this app's widgets (the same block in each — a widget cannot load another
     widget's files). fmtNum writes numbers the way the dashboard language does: 8,8 kW in
     German, 8.8 kW in English (1.2.300). poller asks one request at a time, says so when the
     first answer never comes, dims values after two missed answers instead of showing them
     as live, and rests while the dashboard is hidden. fitHeight follows content whose height
     changes, through Homey.setHeight, and only when it does. ───────────────────────────── */
  var _nf = {};
  function fmtNum(v, digits) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    var key = (activeLang || '') + '|' + digits;
    if (!_nf[key]) {
      try { _nf[key] = new Intl.NumberFormat(activeLang || undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
      catch (e) { _nf[key] = { format: function (x) { return x.toFixed(digits); } }; }
    }
    return _nf[key].format(v);
  }
  function poller(opts) {
    var busy = false, timer = null, loaded = false, misses = 0;
    function tick() {
      if (busy) return;
      busy = true;
      Promise.resolve().then(opts.run).then(function (data) {
        busy = false; misses = 0; loaded = true;
        document.body.classList.remove('stale');
        opts.onOk(data);
      }, function (err) {
        busy = false; misses++;
        if (!loaded) opts.onFail(true, err);
        else if (misses >= 2) { document.body.classList.add('stale'); opts.onFail(false, err); }
      });
    }
    function start() { if (!timer) timer = setInterval(tick, opts.ms); }
    function stop()  { if (timer) { clearInterval(timer); timer = null; } }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { stop(); return; }
      tick(); start();
    });
    tick();
    if (!document.hidden) start();
    return { now: tick };
  }
  var _fitH = 0;
  function fitHeight(Homey, el) {
    requestAnimationFrame(function () {
      var h = Math.ceil(el.getBoundingClientRect().bottom);
      if (h > 0 && h !== _fitH) { _fitH = h; Homey.setHeight(h); }
    });
  }
  /* ── end of the shared block ── */

  let sessionStartTime = null;

  // The drivers send "Tri-Phase" / "Mono-Phase" and an English "7.4 kW" for the limit;
  // the widget says both in its own language from the numbers (1.2.300).
  function phaseText(s) {
    return (s.phases && T.phases[s.phases]) || s.phaseLabel || '';
  }
  function limitText(s) {
    const m = /([\d.]+)\s*kW/.exec(String(s.limitKw || ''));
    const amps = s.requestedAmps + ' A';
    return m ? fmtNum(parseFloat(m[1]), 1) + ' kW (' + amps + ')' : amps;
  }

  function fmtDuration(ms) {
    const mins = Math.floor(ms / 60000);
    if (mins < 60) return mins + 'm';
    const h = Math.floor(mins / 60);
    return h + 'h ' + (mins % 60) + 'm';
  }

  function tickTimer() {
    if (sessionStartTime) {
      statTimer.textContent = fmtDuration(Date.now() - sessionStartTime);
    } else {
      statTimer.textContent = '—';
    }
  }

  function render(s) {
    if (!s || s.error) {
      statusLabel.textContent = T.notAvailable;
      statusLabel.className = 'status-label';
      statusSub.textContent = !s ? '' : s.error === 'no_charger' ? T.noCharger : (s.error || '');
      card.className = 'card';
      photoWrap.className = 'photo-wrap muted';
      sessionStartTime = null;
      tickTimer();
      return;
    }

    const st = s.sessionStatus || 'not_connected';
    const [label, sub] = T.states[st] || [st, ''];

    // Photo per state: each state has its own ring color where a photo
    // exists — white (connected), pulsing white/blue (charging), orange
    // (paused), green (fully charged), purple (smart charging), red (error)
    const STATE_PHOTOS = {
      not_connected: 'img/idle.jpg',
      connected: 'img/connected.jpg',
      // Charging fades between the UNLIT ring and the blue ring — reads
      // as a breathing blue pulse (like a real LED), rather than the
      // odd-looking color shift a white-to-blue fade produces
      charging: 'img/ring_off.jpg',
      paused: 'img/paused_orange.jpg',
      smart_charging: 'img/smart_purple.jpg',
      fully_charged: 'img/fully_green.jpg',
      finishing: 'img/ring_off.jpg',
      error: 'img/error_red.jpg',
      offline: 'img/ring_off.jpg',
    };
    imgBase.src = STATE_PHOTOS[st] || 'img/idle.jpg';
    // Pulse overlay: blue while charging, green while finishing — pulsing
    // means "in motion", the static green of Fully Charged means "settled"
    imgBlue.src = (st === 'finishing') ? 'img/fully_green.jpg' : 'img/charging_blue.jpg';

    photoWrap.className = 'photo-wrap'
      + (st === 'charging' ? ' charging' : '')
      + (st === 'finishing' ? ' finishing' : '')
      + (st === 'not_connected' || st === 'offline' ? ' muted' : '');

    statusLabel.className = 'status-label' + (st === 'error' ? ' error' : '');
    if (st === 'charging' && s.requestedAmps) {
      statusLabel.textContent = T.charging + ' \u00b7 ' + limitText(s) + ' / ' + phaseText(s);
      statusSub.textContent = '';
    } else if (st === 'paused' && s.requestedAmps) {
      statusLabel.textContent = T.paused;
      statusSub.textContent = T.resumesAt + limitText(s) + ' / ' + phaseText(s);
    } else {
      statusLabel.textContent = label;
      statusSub.textContent = sub;
    }

    // Stats populate while a session is running (charging or paused),
    // and show placeholders otherwise — row always visible for stable height
    if (st === 'charging' || st === 'finishing' || st === 'paused') {
      const kw = (s.powerW || 0) / 1000;
      statPower.textContent = kw >= 1 ? fmtNum(kw, 1) + ' kW' : fmtNum(Math.round(s.powerW || 0), 0) + ' W';
      statAmps.textContent = s.currentA != null ? fmtNum(Math.round(s.currentA * 10) / 10, 1) + ' A' : '—';
      sessionStartTime = s.sessionStartTime || null;
    } else {
      statPower.textContent = '—';
      statAmps.textContent = '—';
      sessionStartTime = null;
    }
    tickTimer();
  }

  // Every 10 s (it asked every 5 s; a charger's meter values arrive every 10 to 60 s). The
  // 1 s tick only advances the session clock on screen. Both rest while the dashboard is
  // hidden and catch up on return.
  poller({
    ms: 10000,
    run: function () { return Homey.api('GET', '/status'); },
    onOk: function (s) { applyLang(s && s.lang); render(s); },
    onFail: function (first) {
      if (first) render({ error: T.unreachable });
      else statusSub.textContent = T.stale;
    },
  });
  var tickTimerId = null;
  function startTick() { if (!tickTimerId) tickTimerId = setInterval(tickTimer, 1000); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearInterval(tickTimerId); tickTimerId = null; return; }
    startTick();
  });
  if (!document.hidden) startTick();

  // Size the widget to fit the full photo plus the status/stats area,
  // whatever width the dashboard gives us. padding-top-based aspect
  // ratio means layout height is known immediately, no image-load wait.
  requestAnimationFrame(() => {
    // Sub-pixel-precise measurement: offsetHeight rounds down, which
    // clipped the stat labels; the blunt +14 buffer that fixed it left a
    // visible trail instead. getBoundingClientRect().bottom is exact —
    // ceil it and add only a hairline for webview chrome.
    const rect = document.getElementById('card').getBoundingClientRect();
    Homey.ready({ height: Math.ceil(rect.bottom) + 8 });
  });
}
</script>
</body>
</html>
