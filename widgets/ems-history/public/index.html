<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

/* Colors come from Homey's own --homey-* variables (widget styling guide),
   which follow the dashboard's light/dark setting. The previous version keyed
   dark-mode overrides off ":root[data-theme=dark]" — that's the Artifacts
   convention, not Homey's; Homey never sets that attribute, so this widget
   was permanently stuck in light styling. The handful of accent dot colors
   with no direct --homey- equivalent are now gated on Homey's actual
   .homey-dark-mode marker class instead. */
/* Sizes and spacing from Homey's widget styling guide too (1.2.300): no text below
   --homey-font-size-small (it went down to 9 px), no second card inside Homey's frame, no
   shadows, buttons big enough for a finger. The widget's name is Homey's title above the
   tile, so it is not repeated inside it. The list scrolls inside the fixed height: a day
   can hold a hundred events. */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; color: var(--homey-text-color); }

.card {
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Day nav ── */
.day-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--homey-su-2);
  flex-shrink: 0;
  gap: var(--homey-su-1);
}
.nav-btn, .refresh-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: none;
  border: var(--homey-line);
  border-radius: 50%;
  cursor: pointer;
  font-size: var(--homey-font-size-small);
  color: var(--homey-text-color-blue, var(--homey-color-blue));
  line-height: 1;
  flex-shrink: 0;
}
.refresh-btn { color: var(--homey-text-color-light); font-size: var(--homey-font-size-default); }
.nav-btn:focus-visible, .refresh-btn:focus-visible { outline: 2px solid var(--homey-color-blue); outline-offset: 2px; }
.nav-btn:disabled { color: var(--homey-text-color-light); opacity: 0.4; cursor: default; }

.day-label-nav {
  font-size: var(--homey-font-size-small);
  line-height: var(--homey-line-height-small);
  font-weight: var(--homey-font-weight-bold);
  color: var(--homey-text-color);
  text-align: center;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Timeline */
.timeline {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow-y: auto;
  padding-bottom: var(--homey-su-2);
  touch-action: pan-y;
}

.day-label {
  font-size: var(--homey-font-size-small);
  line-height: var(--homey-line-height-small);
  font-weight: var(--homey-font-weight-medium);
  color: var(--homey-text-color-light);
  padding: var(--homey-su-2) 0 var(--homey-su-1) 22px;
}

.event-row {
  display: flex;
  align-items: flex-start;
  gap: var(--homey-su-2);
  padding: var(--homey-su-1) 0;
  position: relative;
}

/* Vertical line */
.event-row::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 18px;
  bottom: -4px;
  width: 1px;
  background: var(--homey-line-color-light);
}
.event-row:last-child::before { display: none; }

/* System events get a separator feel */
.event-row.ev-system { margin: var(--homey-su-1) 0 2px; }
.event-row.ev-system::before { background: var(--homey-line-color); }

.dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
  border: 2px solid var(--homey-background-color);
  outline: 1px solid var(--homey-line-color);
}

/* System events: diamond shape instead of circle */
.ev-system .dot {
  border-radius: 3px;
  transform: rotate(45deg);
  width: 10px;
  height: 10px;
  margin-top: 5px;
  margin-left: 1px;
}

.event-body { flex: 1; min-width: 0; }

.event-top {
  display: flex;
  align-items: baseline;
  gap: var(--homey-su-1);
}

.event-mode, .event-time, .event-detail {
  font-size: var(--homey-font-size-small);
  line-height: var(--homey-line-height-small);
}
.event-mode {
  font-weight: var(--homey-font-weight-medium);
  color: var(--homey-text-color);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* System events dimmer label */
.ev-system .event-mode { color: var(--homey-text-color-light); }

.event-time {
  color: var(--homey-text-color-light);
  white-space: nowrap;
  flex-shrink: 0;
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

.event-detail {
  color: var(--homey-text-color-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.empty {
  font-size: var(--homey-font-size-small);
  line-height: var(--homey-line-height-small);
  color: var(--homey-text-color-light);
  text-align: center;
  padding: var(--homey-su-6) 0;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Dot colours — deliberately constant across themes (each color IDs an
   EMS mode/event type, not a text-on-background contrast choice) ── */
.dot-solar-ev           { background: #34c759; }
.dot-solar-hp           { background: #30d158; }
.dot-solar-boiler       { background: #32ade6; }
.dot-solar-pool         { background: #00c7be; }
.dot-offpeak-ev         { background: #007aff; }
.dot-lowtariff-ev       { background: #5ac8fa; }
.dot-price-ev           { background: #5856d6; }
.dot-instant-ev         { background: #af52de; }
.dot-battery            { background: #ff9500; }
.dot-holding            { background: #c7c7cc; }
.dot-idle               { background: #d1d1d6; }
.dot-disabled           { background: #d1d1d6; }
.dot-error              { background: #ff3b30; }
.dot-dev-start          { background: #34c759; }
.dot-dev-stop           { background: #ff6b6b; }
.dot-charger-start      { background: #007aff; }
.dot-charger-amps       { background: #5ac8fa; }
.dot-charger-stop       { background: #c7c7cc; }
.dot-export-limit-on    { background: #ff9f0a; }
.dot-export-limit-off   { background: #aeaeb2; }
.dot-app-start          { background: #8e8e93; }
.dot-app-update         { background: #5e5ce6; }

/* The three neutral-grey dots are too washed-out on a dark card — darken them
   using Homey's actual dark-mode marker class (not the Artifacts data-theme
   attribute, which Homey never sets). */
.homey-dark-mode .dot-holding  { background: #5a5a5f; }
.homey-dark-mode .dot-idle     { background: #4a4a4f; }
.homey-dark-mode .dot-disabled { background: #4a4a4f; }
</style>
</head>
<body class="homey-widget">
<div class="card">
  <div class="day-nav">
    <button class="nav-btn" id="nav-prev">◀</button>
    <div class="day-label-nav" id="nav-day-label">—</div>
    <button class="nav-btn" id="nav-next" disabled>▶</button>
    <button class="refresh-btn" id="refresh-btn">↻</button>
  </div>
  <div class="timeline" id="timeline">
    <div class="empty" id="initialLoading">…</div>
  </div>
</div>

<script type="text/javascript">
function onHomeyReady(Homey) {

var dayOffset = 0;   // 0 = today, 1 = yesterday, 2 = two days ago, …
var allEvents = [];

// ── Translations — mode labels reuse the exact same strings as App Settings
// → EMS History (locales/*.json settings.histMode / settings.history), so
// the wording matches between the settings page and this widget. ──────────
// Language comes from the API payload (Homey's own i18n.getLanguage()), not from
// navigator.language — that is the browser/OS language and can differ from the Homey
// app language. See widgets/ems-device/api.js for the full rationale.
var DICTS = (function () {
  var de = {
    refresh: 'Aktualisieren', prevDay: 'Vorheriger Tag', nextDay: 'Nächster Tag',
    loading: 'Lädt…', failedToLoad: 'Laden fehlgeschlagen', errorPrefix: 'Fehler: ',
    today: 'Heute', yesterday: 'Gestern', noEventsFor: 'Keine Ereignisse für',
    appUpdated: 'App aktualisiert', appStarted: 'App gestartet',
    emsStarted: 'EMS gestartet', emsStopped: 'EMS gestoppt',
    batFull: 'Batterie voll', batLow: 'Batterie tief', batCharge: 'Zwangsladung', batDischarge: 'Zwangsentladung', batHold: 'Hält', batNormal: 'Normalbetrieb',
    started: 'gestartet', chargerStarted: 'Lader gestartet', chargerAdjusted: 'Lader angepasst', chargerStopped: 'Lader gestoppt', stopIneffective: '⚠ Stopp wirkungslos',
    targetReached: 'Ladeziel erreicht', targetReleased: 'Ladeziel aufgehoben',
    manualOn: 'ausserhalb des EMS eingeschaltet', manualOff: 'ausserhalb des EMS ausgeschaltet', startNoEffect: 'gestartet, aber ohne Wirkung',
    forecastGateOn: 'Prognose-Sperre aktiv', forecastGateOff: 'Prognose-Sperre aufgehoben', noEms: 'Kein EMS-Gerät gefunden',
    modes: {
      solar_ev: 'Solar-EV-Laden', solar_hp: 'Solar-Wärmepumpe', solar_boiler: 'Solar-Boiler', solar_pool: 'Solar-Poolpumpe',
      solar_dehumidifier: 'Solar-Entfeuchter', solar_aircon: 'Solar-Klimaanlage', solar_multi: 'Solar (mehrere Geräte)',
      offpeak_ev: 'Off-Peak-EV-Laden', lowtariff_ev: 'Niedertarif-EV-Laden', price_ev: 'Preisoptimiertes EV-Laden',
      instant_ev: 'Sofortladen (max.)', battery_priority: 'Batterie-Priorität', holding: 'Wartet',
      idle: 'Kein EV verbunden', disabled: 'EMS deaktiviert', not_configured: 'Nicht konfiguriert', error: 'Fehler',
      export_limit_on: 'Einspeiselimit aktiviert', export_limit_off: 'Einspeiselimit deaktiviert',
    },
  };
  var nl = {
    refresh: 'Vernieuwen', prevDay: 'Vorige dag', nextDay: 'Volgende dag',
    loading: 'Laden…', failedToLoad: 'Laden mislukt', errorPrefix: 'Fout: ',
    today: 'Vandaag', yesterday: 'Gisteren', noEventsFor: 'Geen gebeurtenissen voor',
    appUpdated: 'App bijgewerkt', appStarted: 'App gestart',
    emsStarted: 'EMS gestart', emsStopped: 'EMS gestopt',
    batFull: 'Accu vol', batLow: 'Accu laag', batCharge: 'Geforceerd laden', batDischarge: 'Geforceerd ontladen', batHold: 'Houdt vast', batNormal: 'Normale modus',
    started: 'gestart', chargerStarted: 'Lader gestart', chargerAdjusted: 'Lader aangepast', chargerStopped: 'Lader gestopt', stopIneffective: '⚠ Stop had geen effect',
    targetReached: 'Laaddoel bereikt', targetReleased: 'Laaddoel opgeheven',
    manualOn: 'buiten de EMS om ingeschakeld', manualOff: 'buiten de EMS om uitgeschakeld', startNoEffect: 'gestart, maar zonder effect',
    forecastGateOn: 'Prognoseblokkering actief', forecastGateOff: 'Prognoseblokkering opgeheven', noEms: 'Geen EMS-apparaat gevonden',
    modes: {
      solar_ev: 'Zon EV-laden', solar_hp: 'Zon warmtepomp', solar_boiler: 'Zon boiler', solar_pool: 'Zon zwembadpomp',
      solar_dehumidifier: 'Zon ontvochtiger', solar_aircon: 'Zonne-airco', solar_multi: 'Zon (meerdere apparaten)',
      offpeak_ev: 'Daltarief EV-laden', lowtariff_ev: 'Laag-tarief EV-laden', price_ev: 'Prijsgeoptimaliseerd EV-laden',
      instant_ev: 'Direct laden (max)', battery_priority: 'Batterijprioriteit', holding: 'Wacht',
      idle: 'Geen EV aangesloten', disabled: 'EMS uitgeschakeld', not_configured: 'Niet geconfigureerd', error: 'Fout',
      export_limit_on: 'Exportlimiet geactiveerd', export_limit_off: 'Exportlimiet gedeactiveerd',
    },
  };
  var en = {
    refresh: 'Refresh', prevDay: 'Previous day', nextDay: 'Next day',
    loading: 'Loading…', failedToLoad: 'Failed to load', errorPrefix: 'Error: ',
    today: 'Today', yesterday: 'Yesterday', noEventsFor: 'No events for',
    appUpdated: 'App updated', appStarted: 'App started',
    emsStarted: 'EMS started', emsStopped: 'EMS stopped',
    batFull: 'Battery full', batLow: 'Battery low', batCharge: 'Forced charge', batDischarge: 'Forced discharge', batHold: 'Holding', batNormal: 'Normal mode',
    started: 'started', chargerStarted: 'Charger started', chargerAdjusted: 'Charger adjusted', chargerStopped: 'Charger stopped', stopIneffective: '⚠ Stop had no effect',
    targetReached: 'Charge target reached', targetReleased: 'Charge target released',
    manualOn: 'switched on outside the EMS', manualOff: 'switched off outside the EMS', startNoEffect: 'started, but without effect',
    forecastGateOn: 'Forecast gate closed', forecastGateOff: 'Forecast gate open', noEms: 'No EMS device found',
    modes: {
      solar_ev: 'Solar EV charging', solar_hp: 'Solar heat pump', solar_boiler: 'Solar boiler', solar_pool: 'Solar pool pump',
      solar_dehumidifier: 'Solar dehumidifier', solar_aircon: 'Solar air conditioning', solar_multi: 'Solar (multiple devices)',
      offpeak_ev: 'Off-peak EV charging', lowtariff_ev: 'Low-tariff EV charging', price_ev: 'Price-optimised EV charging',
      instant_ev: 'Instant charge (max)', battery_priority: 'Battery priority', holding: 'Waiting',
      idle: 'No EV connected', disabled: 'EMS disabled', not_configured: 'Not configured', error: 'Error',
      export_limit_on: 'Export limit activated', export_limit_off: 'Export limit deactivated',
    },
  };
  return { de: de, nl: nl, en: en };
})();
function dictFor(code) {
  var l = String(code || '');
  return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
}
var activeLang = null;
var T = dictFor(navigator.language); // placeholder until the first payload arrives
// The title, the button tooltips and the day label were set once from the placeholder —
// the phone's language — and stayed in it on a German Homey; the day label stayed "—"
// until a day arrow was tapped (1.2.299). All of them follow the language now.
function applyStaticTexts() {
  document.getElementById('refresh-btn').title       = T.refresh;
  document.getElementById('refresh-btn').setAttribute('aria-label', T.refresh);
  document.getElementById('nav-prev').title           = T.prevDay;
  document.getElementById('nav-next').title           = T.nextDay;
  var initial = document.getElementById('initialLoading');
  if (initial) initial.textContent = T.loading;
  document.getElementById('nav-day-label').textContent = navLabel(dayOffset);
}
function applyLang(code) {
  if (!code || code === activeLang) return false;
  activeLang = code;
  T = dictFor(code);
  applyStaticTexts();
  return true;
}

// ── Mode metadata ──────────────────────────────────────────────────────────
var MODE_DOTS = {
  solar_ev: 'dot-solar-ev', solar_hp: 'dot-solar-hp', solar_boiler: 'dot-solar-boiler', solar_pool: 'dot-solar-pool',
  solar_dehumidifier: 'dot-solar-hp', solar_aircon: 'dot-solar-hp', solar_multi: 'dot-solar-hp',
  offpeak_ev: 'dot-offpeak-ev', lowtariff_ev: 'dot-lowtariff-ev', price_ev: 'dot-price-ev', instant_ev: 'dot-instant-ev',
  battery_priority: 'dot-battery', holding: 'dot-holding', idle: 'dot-idle', disabled: 'dot-disabled',
  not_configured: 'dot-disabled', error: 'dot-error', export_limit_on: 'dot-export-limit-on', export_limit_off: 'dot-export-limit-off',
};

var EXTRACT_MODES = { solar_ev:1, offpeak_ev:1, instant_ev:1 };

// ── Time formatting ────────────────────────────────────────────────────────
function fmtTime(ts) {
  var d = new Date(ts);
  var h = d.getHours().toString().padStart(2, '0');
  var m = d.getMinutes().toString().padStart(2, '0');
  return h + ':' + m;
}

// Calendar days, counted with setDate: "n × 24 h before midnight" put the start of every
// day before a clock change an hour off — yesterday began at 01:00, and an event at 00:30
// on a Sunday showed on Saturday's page (1.2.299).
function dayStart(offset) {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - offset);
  return d.getTime();
}

function dayEnd(offset) {
  if (offset === 0) return Date.now();
  return dayStart(offset - 1) - 1;
}

function navLabel(offset) {
  if (offset === 0) return T.today;
  if (offset === 1) return T.yesterday;
  var d = new Date(dayStart(offset));
  return d.toLocaleDateString(activeLang || undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}

function fmtDayLabel(ts) {
  var d   = new Date(ts);
  var now = new Date();
  var today     = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1).getTime();
  var ds        = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  if (ds === today)     return T.today;
  if (ds === yesterday) return T.yesterday;
  return d.toLocaleDateString(activeLang || undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}

// ── Extract numeric info from status text ──────────────────────────────────
function fmtStatusDetail(raw) {
  if (!raw) return '';
  var parts = [];
  var amps  = raw.match(/(\d+A\/\d+ph)/);        if (amps)  parts.push(amps[1]);
  var bat   = raw.match(/Bat\s+(\d+)%/);          if (bat)   parts.push('Bat ' + bat[1] + '%');
  var batW  = raw.match(/([↑↓]\d+(?:\.\d+)?W)/); if (batW)  parts.push(batW[1]);
  return parts.join(' · ');
}

// ── Build event display info ───────────────────────────────────────────────
function eventInfo(ev) {
  if (ev.type === 'system') {
    // The forecast gate is a system event too, and was labelled "App started" (1.2.299).
    if (ev.event === 'forecast_gate_on' || ev.event === 'forecast_gate_off') {
      return { cls: 'ev-system', dot: ev.event === 'forecast_gate_on' ? 'dot-holding' : 'dot-app-start',
               label: ev.event === 'forecast_gate_on' ? T.forecastGateOn : T.forecastGateOff,
               detail: ev.label || '' };
    }
    var isUpdate = ev.event === 'app_update';
    var isStart  = ev.event === 'app_start';
    return {
      cls:    'ev-system',
      dot:    isUpdate ? 'dot-app-update' : 'dot-app-start',
      label:  isUpdate ? T.appUpdated : isStart ? T.appStarted : ev.event,
      detail: ev.label || '',
    };
  }
  if (ev.type === 'mode') {
    var modeLabel = T.modes[ev.event] || ev.event;
    var modeDot   = MODE_DOTS[ev.event] || 'dot-idle';
    var statusText = EXTRACT_MODES[ev.event]
      ? (fmtStatusDetail(ev.label) || ev.label || '')
      : (ev.label || '');
    var hasStatus = statusText && statusText !== '—';
    return {
      cls:    '',
      dot:    modeDot,
      label:  hasStatus ? statusText : modeLabel,
      detail: hasStatus ? modeLabel : '',
    };
  }
  if (ev.type === 'device') {
    // Battery events share the device category but are not starts or stops — without
    // this they all fell through to isStart=false and read as "EMS stopped".
    var BAT = { battery_full: T.batFull, battery_low: T.batLow, battery_charge: T.batCharge,
                battery_discharge: T.batDischarge, battery_hold: T.batHold, battery_normal: T.batNormal };
    if (BAT[ev.event]) {
      return { cls: '', dot: ev.event === 'battery_low' ? 'dot-dev-stop' : 'dot-dev-start',
               label: BAT[ev.event], detail: ev.label || '' };
    }
    var devName = ev.label || (ev.deviceId ? ev.deviceId.slice(0, 8) : '');
    // Switched by hand, or started without effect: everything that was not 'start' used to
    // read "EMS stopped" (1.2.299).
    var DEV = { start: T.emsStarted, stop: T.emsStopped, manual_on: T.manualOn,
                manual_off: T.manualOff, start_no_effect: T.startNoEffect };
    var on = ev.event === 'start' || ev.event === 'manual_on';
    return {
      cls:    '',
      dot:    on ? 'dot-dev-start' : 'dot-dev-stop',
      label:  devName,
      detail: DEV[ev.event] || ev.event,
    };
  }
  if (ev.type === 'charger') {
    if (ev.event === 'start')    return { cls:'', dot: 'dot-charger-start', label: ev.label || T.started, detail: T.chargerStarted  };
    if (ev.event === 'set_amps') return { cls:'', dot: 'dot-charger-amps',  label: '→ ' + ev.label,       detail: T.chargerAdjusted };
    if (ev.event === 'stop')     return { cls:'', dot: 'dot-charger-stop',  label: T.chargerStopped,      detail: ''                };
    if (ev.event === 'stop_ineffective') return { cls:'', dot: 'dot-charger-stop', label: T.stopIneffective, detail: ev.label || '' };
    if (ev.event === 'target_reached')   return { cls:'', dot: 'dot-charger-stop', label: T.targetReached,   detail: ev.label || '' };
    if (ev.event === 'target_released')  return { cls:'', dot: 'dot-charger-amps', label: T.targetReleased,  detail: ev.label || '' };
  }
  return { cls: '', dot: 'dot-idle', label: ev.event, detail: ev.label || '' };
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  var tl    = document.getElementById('timeline');
  var start = dayStart(dayOffset);
  var end   = dayEnd(dayOffset);

  var filtered = allEvents
    .filter(function(e) { return e.ts >= start && e.ts <= end; })
    .slice()
    .reverse(); // newest first

  if (!filtered.length) {
    tl.innerHTML = '<div class="empty">' + esc(T.noEventsFor) + ' ' + esc(navLabel(dayOffset)) + '</div>';
    return;
  }

  var html = '';
  var lastDay = '';

  for (var i = 0; i < filtered.length; i++) {
    var ev  = filtered[i];
    var day = fmtDayLabel(ev.ts);
    if (day !== lastDay) {
      html += '<div class="day-label">' + esc(day) + '</div>';
      lastDay = day;
    }
    var info = eventInfo(ev);
    html += '<div class="event-row ' + info.cls + '">';
    html += '<div class="dot ' + info.dot + '"></div>';
    html += '<div class="event-body">';
    html += '<div class="event-top">';
    html += '<span class="event-mode">' + esc(info.label) + '</span>';
    html += '<span class="event-time">' + fmtTime(ev.ts) + '</span>';
    html += '</div>';
    if (info.detail) {
      html += '<div class="event-detail">' + esc(info.detail) + '</div>';
    }
    html += '</div></div>';
  }

  tl.innerHTML = html;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// ── Nav ────────────────────────────────────────────────────────────────────
function updateNav() {
  document.getElementById('nav-day-label').textContent = navLabel(dayOffset);
  document.getElementById('nav-next').disabled = (dayOffset === 0);
  renderedFor = '';
  render();
}

// A short buzz on a tap, where the device has it (Homey's widget API, 1.2.300).
function haptic() { try { Homey.hapticFeedback(); } catch (e) {} }

document.getElementById('nav-prev').addEventListener('click', function() {
  haptic();
  dayOffset++;
  updateNav();
});
document.getElementById('nav-next').addEventListener('click', function() {
  haptic();
  if (dayOffset > 0) { dayOffset--; updateNav(); }
});

// ── Load ───────────────────────────────────────────────────────────────────
// After the first full load only what is new is fetched (?since=), and the list is redrawn
// only when something arrived or the day changed.
var newestTs = 0;
var renderedFor = '';
// One request at a time: a slow answer used to be overtaken by the next poll (1.2.300).
var loading = false;
async function load(full) {
  if (loading) return;
  loading = true;
  var again = false;
  try {
    var since = full ? 0 : newestTs;
    var result = await Homey.api('GET', since ? '/history?since=' + since : '/history');
    applyLang(result && result.lang); // authoritative language, before anything is drawn
    if (!result || result.error) {
      var msg = result && result.error === 'no_ems_device' ? T.noEms : ((result && result.error) || T.failedToLoad);
      document.getElementById('timeline').innerHTML = '<div class="empty">' + esc(msg) + '</div>';
      renderedFor = '';
      return;
    }
    var events = result.events || [];
    if (result.full) {
      allEvents = events;
    } else if (typeof result.newestTs === 'number' && result.newestTs < newestTs) {
      again = true; // the history shrank behind our back — start over
      return;
    } else if (events.length) {
      allEvents = allEvents.concat(events).slice(-400);
    }
    if (allEvents.length) newestTs = allEvents[allEvents.length - 1].ts;
    var key = allEvents.length + ':' + newestTs + ':' + dayOffset + ':' + new Date().toDateString() + ':' + activeLang;
    if (key !== renderedFor) { renderedFor = key; render(); }
  } catch (err) {
    document.getElementById('timeline').innerHTML =
      '<div class="empty">' + esc(T.errorPrefix + (err.message || String(err))) + '</div>';
    renderedFor = '';
  } finally {
    loading = false;
    if (again) load(true);
  }
}

document.getElementById('refresh-btn').addEventListener('click', function () { haptic(); load(true); });

// Auto-refresh every 30 s (only re-fetches, keeps current day view). Stops entirely
// while the dashboard is hidden — an open widget used to keep polling around the clock —
// and catches up immediately on return.
var POLL_MS = 30000;
var timer = null;
function startPolling() { if (!timer) timer = setInterval(load, POLL_MS); }
function stopPolling()  { if (timer) { clearInterval(timer); timer = null; } }
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { stopPolling(); return; }
  load();
  startPolling();
});

applyStaticTexts();
load(true);
if (!document.hidden) startPolling();

Homey.ready();
} // onHomeyReady
</script>
</body>
</html>
