<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensor Chart</title>
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 12px 14px 8px;
    overflow: hidden;
  }

  /* ── Header row ── */
  .header {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
    min-height: 20px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    flex: 1;
    min-width: 0;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }

  .legend-line {
    width: 14px;
    height: 2.5px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .legend-name {
    font-size: 10px;
    font-weight: 500;
    color: var(--homey-text-color-light);
    white-space: nowrap;
  }

  .legend-val {
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* ── Stepper ── */
  .stepper {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .step-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--homey-line-color, rgba(128,128,128,0.35));
    background: transparent;
    color: var(--homey-text-color);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    flex-shrink: 0;
    transition: background 0.12s, opacity 0.12s;
    padding: 0;
  }

  .step-btn:hover:not(:disabled) { background: rgba(128,128,128,0.15); }
  .step-btn:disabled { opacity: 0.25; cursor: default; }

  .step-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--homey-text-color-light);
    min-width: 26px;
    text-align: center;
  }

  /* ── Chart wrapper ── */
  #chart-wrap {
    width: 100%;
    position: relative;
  }

  #chart-wrap svg { display: block; overflow: visible; }

  /* ── Crosshair ── */
  #xhair {
    position: absolute;
    width: 1px;
    background: currentColor;
    opacity: 0.2;
    pointer-events: none;
    display: none;
  }

  /* ── Tooltip ── */
  #tip {
    position: absolute;
    background: var(--homey-background-color, rgba(18,18,18,0.92));
    border: 1px solid var(--homey-line-color, rgba(128,128,128,0.25));
    border-radius: 7px;
    padding: 5px 9px;
    pointer-events: none;
    display: none;
    z-index: 10;
    white-space: nowrap;
  }

  .tt-time {
    font-size: 9px;
    color: var(--homey-text-color-light);
    margin-bottom: 3px;
  }

  .tt-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  .tt-dot  { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .tt-name { font-size: 9px; color: var(--homey-text-color-light); flex: 1; }
  .tt-val  { font-size: 10px; font-weight: 700; }

  /* ── No-data ── */
  .no-data {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    font-size: 11px;
    color: var(--homey-text-color-light);
  }

  /* ── Loading shimmer ── */
  @keyframes shimmer { 0%,100%{opacity:.25} 50%{opacity:.55} }
  body.loading #chart-wrap,
  body.loading .legend { animation: shimmer 1.6s ease-in-out infinite; }
</style>
</head>
<body class="loading">

<div class="header">
  <div class="legend" id="legend"></div>
  <div class="stepper">
    <button class="step-btn" id="btnDown">−</button>
    <span class="step-label" id="stepLabel">24H</span>
    <button class="step-btn" id="btnUp">+</button>
  </div>
</div>
<div id="chart-wrap">
  <div id="xhair"></div>
  <div id="tip"></div>
</div>

<script>
/* ── Translations ────────────────────────────────────── */
// Language comes from the API payload (Homey i18n.getLanguage()), not
// navigator.language — see widgets/ems-device/api.js.
var DICTS = (function() {
  var de = {
    label1:'PV-Ausgabe', label2:'Batterie', label3:'Netz', label4:'Leistungsaufnahme',
    noData:'Noch keine Daten – wird gesammelt…',
    reselect:'Reihen bitte in den Widget-Einstellungen neu auswählen',
    noSetting:'Bitte Gerät in den Widget-Einstellungen auswählen',
  };
  var nl = {
    label1:'PV-uitvoer', label2:'Batterij', label3:'Net', label4:'Stroomverbruik',
    noData:'Nog geen gegevens – wordt verzameld…',
    reselect:'Selecteer de reeksen opnieuw in de widget-instellingen',
    noSetting:'Selecteer een apparaat in de widget-instellingen',
  };
  var en = {
    label1:'PV Output', label2:'Battery', label3:'Grid', label4:'Power Consumption',
    noData:'No data yet – collecting…',
    reselect:'Please pick the series again in the widget settings',
    noSetting:'Select a device in widget settings',
  };
  return { de: de, nl: nl, en: en };
})();
function dictFor(code) {
  var l = String(code || '');
  return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
}
var activeLang = null;
var T = dictFor(navigator.language); // placeholder until the first payload arrives
function applyLang(code) {
  if (!code || code === activeLang) return false;
  activeLang = code;
  T = dictFor(code);
  return true;
}

/* ── Config ──────────────────────────────────────────── */
var COLORS  = ['#22C55E', '#3B82F6', '#8B5CF6', '#EF4444'];
var CHART_H = 200;
var M       = { top: 6, right: 8, bottom: 20, left: 36 };
/* Preset time-range steps in hours. Beyond 24 h the app answers from its quarter-hour
   tier, kept for a week (1.2.299) — before, all three long steps drew the same 25 hours. */
var STEPS   = [6, 12, 24, 48, 72, 168];

/* ── Helpers ─────────────────────────────────────────── */
function fmt(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  var a = Math.abs(v);
  if (a >= 1000) return (v / 1000).toFixed(1) + ' kW';
  return Math.round(v) + ' W';
}

/* The date as the dashboard's language writes it — "9.10." in German, "10/9" in English.
   It used to be month.day for every language, so "10.9" on the axis was the 9th of
   October while the midnight marker beside it said "9.10." (1.2.299). */
function fmtDay(ts) {
  try {
    return new Date(ts).toLocaleDateString(activeLang || undefined, { day: 'numeric', month: 'numeric' });
  } catch (e) {
    var d = new Date(ts);
    return d.getDate() + '.' + (d.getMonth() + 1) + '.';
  }
}

function fmtTime(ts, hours) {
  var d  = new Date(ts);
  var hh = d.getHours().toString().padStart(2, '0');
  var mm = d.getMinutes().toString().padStart(2, '0');
  if (hours > 48) return fmtDay(ts) + ' ' + hh + ':' + mm;
  return hh + ':' + mm;
}

function labelFor(h) {
  if (h < 24)   return h + 'H';
  if (h === 24) return '24H';
  return (h / 24) + 'D';
}

/* The app sends at most 240 points per series, already thinned, with { v: null } where the
   device was away. Split there: each run is drawn on its own, so a hole stays a hole. */
function runsOf(points) {
  var runs = [[]];
  points.forEach(function(p) {
    if (p.v === null || p.v === undefined) { if (runs[runs.length - 1].length) runs.push([]); return; }
    runs[runs.length - 1].push(p);
  });
  return runs.filter(function(r) { return r.length; });
}

function valuesOf(points) {
  return points.filter(function(p) { return p.v !== null && p.v !== undefined; });
}

function niceStep(range, n) {
  var r = range / n;
  var m = Math.pow(10, Math.floor(Math.log(r) / Math.LN10));
  var s = r / m;
  return (s < 1.5 ? 1 : s < 3.5 ? 2 : s < 7.5 ? 5 : 10) * m;
}

/* Monotone cubic interpolation — prevents bezier overshoot */
function smoothPath(coords) {
  var n = coords.length;
  if (n === 0) return '';
  if (n === 1) return 'M ' + coords[0][0].toFixed(1) + ',' + coords[0][1].toFixed(1);
  if (n === 2) return 'M ' + coords[0][0].toFixed(1) + ',' + coords[0][1].toFixed(1)
                    + ' L ' + coords[1][0].toFixed(1) + ',' + coords[1][1].toFixed(1);
  var d = [];
  for (var i = 0; i < n - 1; i++) {
    var dx = coords[i+1][0] - coords[i][0];
    d.push(dx !== 0 ? (coords[i+1][1] - coords[i][1]) / dx : 0);
  }
  var m = [d[0]];
  for (var i = 1; i < n - 1; i++) m.push(d[i-1] * d[i] <= 0 ? 0 : (d[i-1] + d[i]) / 2);
  m.push(d[n - 2]);
  for (var i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i+1] = 0; continue; }
    var a = m[i] / d[i], b = m[i+1] / d[i], h = Math.sqrt(a*a + b*b);
    if (h > 3) { m[i] = 3*a/h*d[i]; m[i+1] = 3*b/h*d[i]; }
  }
  var path = 'M ' + coords[0][0].toFixed(1) + ',' + coords[0][1].toFixed(1);
  for (var i = 0; i < n - 1; i++) {
    var w = (coords[i+1][0] - coords[i][0]) / 3;
    path += ' C ' + (coords[i][0]+w).toFixed(1)   + ',' + (coords[i][1]+m[i]*w).toFixed(1)
          + ' '   + (coords[i+1][0]-w).toFixed(1) + ',' + (coords[i+1][1]-m[i+1]*w).toFixed(1)
          + ' '   + coords[i+1][0].toFixed(1)     + ',' + coords[i+1][1].toFixed(1);
  }
  return path;
}

/* ── Global chart state (shared with hover handler) ─── */
var G = { ready: false };

/* ── Cached bounding rect (change 5) ─────────────────── */
var _wrapRect = null;

/* ── Legend ──────────────────────────────────────────── */
function updateLegend(series, names) {
  var el = document.getElementById('legend');
  el.innerHTML = '';
  series.forEach(function(s, i) {
    if (!s || !s.points || !valuesOf(s.points).length) return;
    var item = document.createElement('div');
    item.className = 'legend-item';
    var line = document.createElement('div');
    line.className = 'legend-line'; line.style.background = COLORS[i];
    var name = document.createElement('span');
    name.className = 'legend-name'; name.textContent = names[i] || ('S' + (i+1));
    var val = document.createElement('span');
    val.className = 'legend-val'; val.style.color = COLORS[i];
    val.setAttribute('data-series-idx', i);
    // The app's current reading — none for a device that went away, instead of the last
    // value it ever had, drawn as if it were live.
    val.textContent = fmt(s.current);
    item.appendChild(line); item.appendChild(name); item.appendChild(val);
    el.appendChild(item);
  });
}

/* ── Chart render ────────────────────────────────────── */
function renderChart(series, hours) {
  var wrap   = document.getElementById('chart-wrap');
  var W      = wrap.clientWidth || 260;
  var innerW = W - M.left - M.right;
  var innerH = CHART_H - M.top - M.bottom;

  /* crosshair geometry */
  var xhairEl = document.getElementById('xhair');
  xhairEl.style.top    = M.top + 'px';
  xhairEl.style.height = innerH + 'px';

  var allPts = [];
  series.forEach(function(s) { if (s && s.points) allPts = allPts.concat(valuesOf(s.points)); });

  if (!allPts.length) {
    // "No data yet" invites waiting, and waiting is exactly wrong for a series saved
    // against the old key format: nothing will ever arrive under that key. The API says
    // which case it is, so the widget can ask for the one thing that fixes it.
    // Empty slots (a series not set up) are not part of the verdict.
    var present = series.filter(function(s) { return s; });
    var stale = present.length > 0 && present.every(function(s) { return s.known === false; });
    var old = wrap.querySelector('svg'); if (old) old.remove();
    var nd  = wrap.querySelector('.no-data') || document.createElement('div');
    nd.className = 'no-data'; nd.textContent = stale ? T.reselect : T.noData;
    if (!nd.parentNode) wrap.insertAdjacentElement('afterbegin', nd);
    G.ready = false; return;
  }

  var tMin = Infinity, tMax = -Infinity, vMin = Infinity, vMax = -Infinity;
  allPts.forEach(function(p) {
    var t = new Date(p.t).getTime();
    if (t < tMin) tMin = t; if (t > tMax) tMax = t;
    if (p.v < vMin) vMin = p.v; if (p.v > vMax) vMax = p.v;
  });

  var vRange = vMax - vMin || Math.max(1, Math.abs(vMax) * 0.1);
  var pad    = vRange * 0.12;
  vMin -= pad; vMax += pad;
  var step   = niceStep(vMax - vMin, 4);
  var yStart = Math.floor(vMin / step) * step;
  var yEnd   = Math.ceil(vMax  / step) * step;
  if (yEnd === yStart) yEnd = yStart + step;
  var tRange = tMax - tMin || 1;

  function tx(t) { return M.left + (t - tMin) / tRange * innerW; }
  function ty(v) { return M.top  + (1 - (v - yStart) / (yEnd - yStart)) * innerH; }

  /* expose to hover handler (names added by caller after renderChart) */
  G = { ready: true, series: series, tMin: tMin, tRange: tRange,
        innerW: innerW, innerH: innerH, tx: tx, ty: ty, hours: hours, W: W };

  /* ── Build SVG ── */
  var svg = '<svg width="' + W + '" height="' + CHART_H + '">';

  /* defs */
  svg += '<defs>';
  svg += '<clipPath id="cc"><rect x="' + M.left + '" y="' + M.top
       + '" width="' + innerW + '" height="' + (innerH + 2) + '"/></clipPath>';
  series.forEach(function(s, i) {
    if (!s || !s.points || !s.points.length) return;
    var c = COLORS[i];
    svg += '<linearGradient id="grd' + i + '" x1="0" y1="0" x2="0" y2="1">'
         + '<stop offset="0%"   stop-color="' + c + '" stop-opacity="0.22"/>'
         + '<stop offset="85%"  stop-color="' + c + '" stop-opacity="0.04"/>'
         + '<stop offset="100%" stop-color="' + c + '" stop-opacity="0"/>'
         + '</linearGradient>';
  });
  svg += '</defs>';

  /* Y gridlines + labels */
  for (var yv = yStart; yv <= yEnd + step * 0.001; yv += step) {
    var yy = ty(yv);
    if (yy < M.top - 3 || yy > M.top + innerH + 3) continue;
    var op = (yv === 0) ? '0.18' : '0.07';
    svg += '<line x1="' + M.left + '" y1="' + yy.toFixed(1)
         + '" x2="' + (M.left + innerW) + '" y2="' + yy.toFixed(1)
         + '" stroke="currentColor" stroke-opacity="' + op + '" stroke-width="1"/>';
    var lbl = Math.abs(yv) >= 1000 ? (yv/1000).toFixed(1)+'k' : Math.round(yv).toString();
    svg += '<text x="' + (M.left-5) + '" y="' + (yy+3.5).toFixed(1)
         + '" text-anchor="end" font-size="8" fill="currentColor" opacity="0.35">' + lbl + '</text>';
  }

  /* X time labels */
  for (var j = 0; j <= 4; j++) {
    var xt = tMin + tRange * j / 4;
    svg += '<text x="' + tx(xt).toFixed(1) + '" y="' + (CHART_H - 5)
         + '" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.35">'
         + fmtTime(xt, hours) + '</text>';
  }

  /* Midnight separators for multi-day views (change 2) */
  if (hours > 24) {
    var md = new Date(tMin);
    md.setHours(0, 0, 0, 0);
    md.setDate(md.getDate() + 1);
    while (md.getTime() < tMax) {
      var mx = tx(md.getTime());
      svg += '<line x1="' + mx.toFixed(1) + '" y1="' + M.top
           + '" x2="' + mx.toFixed(1) + '" y2="' + (M.top + innerH).toFixed(1)
           + '" stroke="currentColor" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3,3"/>';
      var mdLbl = fmtDay(md.getTime());
      svg += '<text x="' + (mx + 3).toFixed(1) + '" y="' + (M.top + 9)
           + '" font-size="7" fill="currentColor" opacity="0.3">' + mdLbl + '</text>';
      md.setDate(md.getDate() + 1);
    }
  }

  /* Series: area fill + line + end dot */
  series.forEach(function(s, i) {
    if (!s || !s.points) return;
    var base = (M.top + innerH).toFixed(1);
    var runs = runsOf(s.points);
    runs.forEach(function(run) {
      var coords = run.map(function(p) { return [tx(new Date(p.t).getTime()), ty(p.v)]; });
      if (coords.length < 2) {
        svg += '<circle cx="' + coords[0][0].toFixed(1) + '" cy="' + coords[0][1].toFixed(1)
             + '" r="1.5" fill="' + COLORS[i] + '"/>';
        return;
      }
      var line = smoothPath(coords);
      var area = line + ' L' + coords[coords.length-1][0].toFixed(1) + ',' + base
               + ' L' + coords[0][0].toFixed(1) + ',' + base + ' Z';
      svg += '<path d="' + area + '" fill="url(#grd' + i + ')" clip-path="url(#cc)"/>';
      svg += '<path d="' + line + '" fill="none" stroke="' + COLORS[i]
           + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#cc)"/>';
    });
    // The end dot marks "now" — only where there is a reading now.
    var lastRun = runs[runs.length - 1];
    if (lastRun && s.current !== null && s.current !== undefined) {
      var lpt = lastRun[lastRun.length - 1];
      var lp  = [tx(new Date(lpt.t).getTime()), ty(lpt.v)];
      svg += '<circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1)
           + '" r="5.5" fill="' + COLORS[i] + '" opacity="0.18"/>';
      svg += '<circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1)
           + '" r="2.8" fill="' + COLORS[i] + '"/>';
    }
  });

  svg += '</svg>';

  /* replace old SVG (keep #xhair and #tip) */
  var oldSvg = wrap.querySelector('svg');
  var oldNd  = wrap.querySelector('.no-data');
  if (oldSvg) oldSvg.remove();
  if (oldNd)  oldNd.remove();
  wrap.insertAdjacentHTML('afterbegin', svg);
}

/* ── Hover: crosshair + tooltip ──────────────────────── */
var xhairEl = document.getElementById('xhair');
var tipEl   = document.getElementById('tip');

function findNearest(pts, tMs) {
  var best = null, bestD = Infinity;
  valuesOf(pts).forEach(function(p) {
    var d = Math.abs(new Date(p.t).getTime() - tMs);
    if (d < bestD) { bestD = d; best = p; }
  });
  return best;
}

function showHover(mouseX) {
  if (!G.ready) return;
  if (mouseX < M.left || mouseX > M.left + G.innerW) { hideHover(); return; }

  var tMs   = G.tMin + (mouseX - M.left) / G.innerW * G.tRange;
  var names = G.names || [];

  /* crosshair */
  xhairEl.style.left    = mouseX.toFixed(0) + 'px';
  xhairEl.style.display = 'block';

  /* tooltip content + legend live update (change 3) */
  var html = '<div class="tt-time">' + fmtTime(tMs, G.hours) + '</div>';
  var rows = 0;
  G.series.forEach(function(s, i) {
    if (!s || !s.points || !s.points.length) return;
    var pt = findNearest(s.points, tMs);
    if (!pt) return;
    rows++;
    html += '<div class="tt-row">'
          + '<span class="tt-dot" style="background:' + COLORS[i] + '"></span>'
          + '<span class="tt-name">' + (names[i] || 'S'+(i+1)) + '</span>'
          + '<span class="tt-val" style="color:' + COLORS[i] + '">' + fmt(pt.v) + '</span>'
          + '</div>';
    /* update legend value to reflect hovered position */
    var el = document.querySelector('.legend-val[data-series-idx="' + i + '"]');
    if (el) el.textContent = fmt(pt.v);
  });

  if (!rows) { hideHover(); return; }

  tipEl.innerHTML     = html;
  tipEl.style.display = 'block';

  /* position: prefer right of cursor, flip left if too close to edge */
  var tipW  = tipEl.offsetWidth  || 100;
  var tipH  = tipEl.offsetHeight || 60;
  var wrapW = document.getElementById('chart-wrap').clientWidth;
  var left  = mouseX + 12;
  var top   = M.top + 4;
  if (left + tipW > wrapW - 4) left = mouseX - tipW - 8;
  if (top  + tipH > CHART_H - M.bottom) top = CHART_H - M.bottom - tipH;
  tipEl.style.left = left + 'px';
  tipEl.style.top  = top  + 'px';
}

function hideHover() {
  xhairEl.style.display = 'none';
  tipEl.style.display   = 'none';
  /* restore legend to last-known values (change 3) */
  if (G.ready && G.series) {
    G.series.forEach(function(s, i) {
      if (!s || !s.points || !s.points.length) return;
      var el   = document.querySelector('.legend-val[data-series-idx="' + i + '"]');
      if (el) el.textContent = fmt(s.current);
    });
  }
}

/* ── Homey entry point ───────────────────────────────── */
function onHomeyReady(Homey) {
  Homey.ready({ height: 260 });

  var settings = {};
  try { settings = Homey.getSettings() || {}; } catch (e) {}

  function resolve(val) {
    if (!val) return { id: null, name: '' };
    if (typeof val === 'object' && val.id) return { id: val.id, name: val.name || '' };
    if (typeof val === 'string' && val.length) return { id: val, name: val };
    return { id: null, name: '' };
  }

  var s = [resolve(settings.series1), resolve(settings.series2),
           resolve(settings.series3), resolve(settings.series4)];

  // Built when drawn, not here: before the first answer T is the phone's language, and
  // names made from it stayed in that language for good (1.2.299).
  function namesNow() {
    var defaultLabels = [T.label1, T.label2, T.label3, T.label4];
    return ['label1','label2','label3','label4'].map(function(k, i) {
      var c = settings[k];
      return (typeof c === 'string' && c.trim()) ? c.trim() : (s[i].name || defaultLabels[i]);
    });
  }

  // Any one series is enough. Series 1 used to be required, so a chart set up with only
  // series 2 asked for a device forever.
  if (!s.some(function(x) { return x.id; })) {
    document.body.classList.remove('loading');
    document.getElementById('chart-wrap').innerHTML =
      '<div class="no-data" id="no-setting"></div>';
    document.getElementById('no-setting').textContent = T.noSetting;
    // The language arrives with the first answer; ask once so the hint is in it.
    Homey.api('GET', '/?hours=1', {}).then(function(data) {
      if (applyLang(data && data.lang)) document.getElementById('no-setting').textContent = T.noSetting;
    }).catch(function() {});
    return;
  }

  /* ── Stepper ── */
  var initHours = parseFloat(settings.range_hours) || 24;
  var stepIdx   = 2; // default: index of 24h
  STEPS.forEach(function(h, i) {
    if (Math.abs(h - initHours) < Math.abs(STEPS[stepIdx] - initHours)) stepIdx = i;
  });

  var btnDown   = document.getElementById('btnDown');
  var btnUp     = document.getElementById('btnUp');
  var stepLabel = document.getElementById('stepLabel');

  function updateStepper() {
    stepLabel.textContent = labelFor(STEPS[stepIdx]);
    btnDown.disabled = stepIdx <= 0;
    btnUp.disabled   = stepIdx >= STEPS.length - 1;
  }
  updateStepper();

  /* ── Load ── */
  var pollTimer = null;

  function buildUrl(h) {
    var url = '/?hours=' + h;
    for (var i = 0; i < 4; i++) {
      if (s[i].id) url += '&s' + (i + 1) + '=' + encodeURIComponent(s[i].id);
    }
    return url;
  }

  // The answer is drawn with the hours it was asked for, and only if no newer request has
  // gone out since. Pressing + a few times fired a request per step, and whichever answer
  // came back last was drawn under whatever label the stepper showed by then — a day of
  // points labelled "7D" (1.2.299).
  var reqSeq = 0;
  var retryTimer = null;
  function load() {
    var seq = ++reqSeq;
    var h   = STEPS[stepIdx];
    Homey.api('GET', buildUrl(h), {})
      .then(function(data) {
        if (seq !== reqSeq) return;
        applyLang(data && data.lang);
        document.body.classList.remove('loading');
        if (!data || !data.series) return;
        // Right after an app start the history is still being loaded: wait for it instead
        // of reporting every series as unknown.
        if (data.ready === false) {
          renderChart([], h);
          clearTimeout(retryTimer);
          retryTimer = setTimeout(load, 10000);
          return;
        }
        // Keep each answer in its slot: s[i] is series i+1 and owns COLORS[i].
        var bySlot = [null, null, null, null];
        var k = 0;
        for (var i = 0; i < 4; i++) if (s[i].id) bySlot[i] = data.series[k++] || null;
        var names = namesNow();
        updateLegend(bySlot, names);
        renderChart(bySlot.filter(function(x) { return x; }).length ? bySlot : [], h);
        G.names = names; // used by showHover / hideHover (change 3)
      })
      .catch(function(e) {
        if (seq !== reqSeq) return;
        document.body.classList.remove('loading');
        console.error('sensor-chart:', e);
      });
  }

  function resetPoll() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(load, 60000);
  }

  /* stepper click — the label moves at once, the request waits until the steps settle */
  var stepTimer = null;
  function applyStep(dir) {
    var next = stepIdx + dir;
    if (next < 0 || next >= STEPS.length) return;
    stepIdx = next;
    updateStepper();
    hideHover();
    clearTimeout(stepTimer);
    stepTimer = setTimeout(function() { load(); resetPoll(); }, 250);
  }

  btnDown.addEventListener('click', function() { applyStep(-1); });
  btnUp.addEventListener('click',   function() { applyStep(+1); });

  /* hold to repeat */
  var holdT = null, holdI = null;
  function startHold(dir) {
    holdT = setTimeout(function() {
      holdI = setInterval(function() { applyStep(dir); }, 150);
    }, 400);
  }
  function stopHold() { clearTimeout(holdT); clearInterval(holdI); }

  [btnDown, btnUp].forEach(function(btn) {
    var dir = (btn === btnUp) ? 1 : -1;
    btn.addEventListener('mousedown',  function() { startHold(dir); });
    btn.addEventListener('touchstart', function() { startHold(dir); }, { passive: true });
    btn.addEventListener('mouseup',    stopHold);
    btn.addEventListener('mouseleave', stopHold);
    btn.addEventListener('touchend',   stopHold);
  });

  /* ── Hover events (change 5: cache getBoundingClientRect) ── */
  var wrap = document.getElementById('chart-wrap');

  wrap.addEventListener('mousemove', function(e) {
    if (!_wrapRect) _wrapRect = wrap.getBoundingClientRect();
    showHover(e.clientX - _wrapRect.left);
  });
  wrap.addEventListener('mouseleave', function() {
    _wrapRect = null; // invalidate on leave so next entry is fresh
    hideHover();
  });

  wrap.addEventListener('touchmove', function(e) {
    if (!e.touches.length) return;
    if (!_wrapRect) _wrapRect = wrap.getBoundingClientRect();
    showHover(e.touches[0].clientX - _wrapRect.left);
  }, { passive: true });
  wrap.addEventListener('touchend', function() {
    _wrapRect = null;
    hideHover();
  });

  window.addEventListener('resize', function() { _wrapRect = null; });

  /* ── Start ── */
  load();
  resetPoll();

  // Stop polling entirely while the dashboard is hidden — it used to keep running around
  // the clock — and catch up immediately on return. resetPoll() re-arms the same timer
  // the stepper controls already use, so the two never fight over pollTimer.
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      return;
    }
    load();
    resetPoll();
  });
}
</script>
</body>
</html>
